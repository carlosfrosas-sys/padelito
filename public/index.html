<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padelito</title>
<meta name="description" content="Sorteo de parejas y marcador en vivo para pádel americano.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EAF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07161F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Padelito">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  :root{
    --paper:#EAF1F5;
    --card:#FFFFFF;
    --card-2:#F3F8FB;
    --ink:#0B1F2C;
    --muted:#5E7A8A;
    --line:#D2E0E8;
    --line-soft:#E7EFF4;
    --brand:#0F4C75;
    --brand-wash:#DFEBF4;
    --ball:#C9E22B;
    --ball-strong:#B6CE1E;
    --ball-ink:#1B2400;
    --ball-wash:#F1F8D2;
    --gold:#7E590C;   --gold-bg:#F8EED3;   --gold-on:#FFFFFF;
    --silver:#5C6A75;  --silver-bg:#E7EDF1;  --silver-on:#FFFFFF;
    --bronze:#8A5024;  --bronze-bg:#F4DFCE;  --bronze-on:#FFFFFF;
    --net:#9FB9C7;
    --net-cord:#0B1F2C;
    --win:#12805A;
    --loss:#BE4A3E;
    --live:#C0271F;
    --turf:#F0F6FA;
    --shadow:0 1px 1px rgba(11,31,44,.05), 0 10px 24px -16px rgba(11,31,44,.35);
    --f-display:"Avenir Next Condensed","Avenir Next Condensed Demi Bold",Futura,"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
    --f-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#07161F;
      --card:#0E2632;
      --card-2:#14313F;
      --ink:#E9F2F7;
      --muted:#8CA9B8;
      --line:#20404F;
      --line-soft:#173440;
      --brand:#63B4E6;
      --brand-wash:#12303F;
      --ball:#CFE93C;
      --ball-strong:#DDF25A;
      --ball-ink:#131C00;
      --ball-wash:#1F2E10;
    --gold:#F0CE68;   --gold-bg:#342B10;   --gold-on:#211900;
    --silver:#CBD7DF;  --silver-bg:#28323A;  --silver-on:#111A1F;
    --bronze:#E2A574;  --bronze-bg:#3A281B;  --bronze-on:#201206;
      --gold:#F0CE68;   --gold-bg:#342B10;   --gold-on:#211900;
      --silver:#CBD7DF;  --silver-bg:#28323A;  --silver-on:#111A1F;
      --bronze:#E2A574;  --bronze-bg:#3A281B;  --bronze-on:#201206;
      --net:#3E6072;
      --net-cord:#7FA4B5;
      --win:#3CCB92;
      --loss:#EE8071;
      --live:#FF6A5E;
      --turf:#102A38;
      --shadow:0 1px 1px rgba(0,0,0,.5), 0 14px 30px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --paper:#07161F;
    --card:#0E2632;
    --card-2:#14313F;
    --ink:#E9F2F7;
    --muted:#8CA9B8;
    --line:#20404F;
    --line-soft:#173440;
    --brand:#63B4E6;
    --brand-wash:#12303F;
    --ball:#CFE93C;
    --ball-strong:#DDF25A;
    --ball-ink:#131C00;
    --ball-wash:#1F2E10;
    --net:#3E6072;
    --net-cord:#7FA4B5;
    --win:#3CCB92;
    --loss:#EE8071;
    --live:#FF6A5E;
    --turf:#102A38;
    --shadow:0 1px 1px rgba(0,0,0,.5), 0 14px 30px -18px rgba(0,0,0,.9);
  }

  /* Paletas completas por color. Lima es el juego original y no lleva bloque. */
  :root[data-accent="azul"]{--paper:#DBE8F1;--card:#F7FAFC;--card-2:#E8F1F6;--ink:#0C2536;--muted:#4C7792;--line:#B7D1E2;--line-soft:#D9E7F0;--turf:#F1F6FA;--brand:#1D6FA5;--brand-wash:#DBE8F1;--ball:#1D6FA5;--ball-strong:#175C89;--ball-ink:#FFFFFF;--ball-wash:#DBE8F1}
  :root[data-accent="naranja"]{--paper:#F5E6D9;--card:#FDF9F7;--card-2:#F9EFE7;--ink:#1A242A;--muted:#736C62;--line:#EBCCB2;--line-soft:#F5E4D6;--turf:#FBF5F1;--brand:#AB550D;--brand-wash:#F5E5D9;--ball:#A64F06;--ball-strong:#8E4404;--ball-ink:#FFFFFF;--ball-wash:#F5E5D9}
  :root[data-accent="rosa"]{--paper:#F5DFEA;--card:#FDF8FA;--card-2:#F9EBF2;--ink:#192132;--muted:#796886;--line:#EBC0D5;--line-soft:#F4DDE9;--turf:#FBF3F7;--brand:#C0397B;--brand-wash:#F5DFE9;--ball:#B32F70;--ball-strong:#95265B;--ball-ink:#FFFFFF;--ball-wash:#F5DFE9}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"])[data-accent="azul"]{--paper:#091F2C;--card:#102F41;--card-2:#153A4E;--ink:#DFEBF3;--muted:#769DB4;--line:#1F4960;--line-soft:#183E51;--turf:#123346;--brand:#649CC0;--brand-wash:#123B53;--ball:#5FB4E8;--ball-strong:#7CC5F0;--ball-ink:#04202E;--ball-wash:#123B53}
    :root:not([data-theme="light"])[data-accent="naranja"]{--paper:#1A1D1D;--card:#252E2D;--card-2:#2E3838;--ink:#E7EBEB;--muted:#979A96;--line:#404642;--line-soft:#343B38;--turf:#273133;--brand:#CF8344;--brand-wash:#413728;--ball:#F0A257;--ball-strong:#F5B67A;--ball-ink:#2A1400;--ball-wash:#413728}
    :root:not([data-theme="light"])[data-accent="rosa"]{--paper:#1A1A28;--card:#25283B;--card-2:#2E3248;--ink:#E7E9F1;--muted:#9693AC;--line:#403F58;--line-soft:#34354A;--turf:#272C41;--brand:#D476A4;--brand-wash:#412B47;--ball:#F183B8;--ball-strong:#F6A2CB;--ball-ink:#33061D;--ball-wash:#412B47}
  }
  :root[data-theme="dark"][data-accent="azul"]{--paper:#091F2C;--card:#102F41;--card-2:#153A4E;--ink:#DFEBF3;--muted:#769DB4;--line:#1F4960;--line-soft:#183E51;--turf:#123346;--brand:#649CC0;--brand-wash:#123B53;--ball:#5FB4E8;--ball-strong:#7CC5F0;--ball-ink:#04202E;--ball-wash:#123B53}
  :root[data-theme="dark"][data-accent="naranja"]{--paper:#1A1D1D;--card:#252E2D;--card-2:#2E3838;--ink:#E7EBEB;--muted:#979A96;--line:#404642;--line-soft:#343B38;--turf:#273133;--brand:#CF8344;--brand-wash:#413728;--ball:#F0A257;--ball-strong:#F5B67A;--ball-ink:#2A1400;--ball-wash:#413728}
  :root[data-theme="dark"][data-accent="rosa"]{--paper:#1A1A28;--card:#25283B;--card-2:#2E3248;--ink:#E7E9F1;--muted:#9693AC;--line:#403F58;--line-soft:#34354A;--turf:#272C41;--brand:#D476A4;--brand-wash:#412B47;--ball:#F183B8;--ball-strong:#F6A2CB;--ball-ink:#33061D;--ball-wash:#412B47}

  *{box-sizing:border-box}
  /* Sin zoom por doble toque en el iPhone: al anotar se dan toques rápidos
     y Safari lo interpretaba como acercar. El pellizco para ampliar sigue. */
  html{touch-action:manipulation}
  body{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:16px;
    line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{font:inherit;color:inherit;touch-action:manipulation}
  button{-webkit-user-select:none;user-select:none}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

  .wrap{max-width:640px;margin:0 auto;padding:0 14px 108px}

  /* ---------- barra superior ---------- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .bar-in{max-width:640px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .mark{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
  /* En la portada el nombre va centrado y a la derecha solo compartir. */
  body.home .bar-in{display:grid;grid-template-columns:38px 1fr 38px;gap:0}
  body.home .mark{grid-column:2;justify-content:center;text-align:center;margin:0}
  body.home .mark small{text-align:center}
  body.home #shareApp{grid-column:3;justify-self:end}
  .ball-dot{
    width:16px;height:16px;border-radius:50%;flex:none;
    background:var(--ball);
    box-shadow:inset 0 0 0 1.5px var(--ball-strong);
    position:relative;
  }
  .ball-dot::after{
    content:"";position:absolute;inset:2px;border-radius:50%;
    border:1.5px solid transparent;border-left-color:var(--card);border-right-color:var(--card);
    transform:rotate(28deg);
  }
  .mark h1{
    font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mark small{
    display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
    color:var(--muted);text-transform:uppercase;line-height:1;margin-top:1px;
  }
  .theme-btn{
    background:transparent;border:1px solid var(--line);border-radius:9px;
    width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted);
  }
  .theme-btn:hover{color:var(--ink);border-color:var(--muted)}
  .theme-btn[hidden]{display:none}   /* si no, el display:grid gana al atributo */

  /* ---------- pestañas de torneos ---------- */
  .tstrip{
    max-width:640px;margin:0 auto;display:flex;gap:6px;align-items:center;
    padding:0 14px 9px;overflow-x:auto;scrollbar-width:none;
  }
  .tstrip::-webkit-scrollbar{display:none}
  .tstrip[hidden]{display:none}

  /* ---------- estado de la conexión ---------- */
  .live{
    display:inline-flex;align-items:center;gap:6px;flex:none;
    font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px;
  }
  .live[hidden]{display:none}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .live.on{color:var(--live);border-color:color-mix(in srgb, var(--live) 40%, var(--line))}
  .live.on i{
    background:var(--live);
    box-shadow:0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent);
    animation:latido 1.8s ease-out infinite;
  }
  .live.off{color:var(--muted)}
  .live.off i{background:var(--muted)}
  @keyframes latido{
    0%   { opacity:1;   box-shadow:0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); }
    70%  { opacity:.55; box-shadow:0 0 0 5px color-mix(in srgb, var(--live) 0%, transparent); }
    100% { opacity:1;   box-shadow:0 0 0 0 color-mix(in srgb, var(--live) 0%, transparent); }
  }

  /* ---------- modo espectador ---------- */

  .viewer{
    padding:12px 14px;border-radius:var(--r);background:var(--brand-wash);
    border:1px solid color-mix(in srgb, var(--brand) 30%, var(--line));
  }
  .viewer b{font-family:var(--f-display);text-transform:uppercase;font-size:17px;letter-spacing:.02em}
  .viewer p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.4}

  .link{
    display:block;width:100%;font-family:var(--f-mono);font-size:12px;word-break:break-all;
    background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    color:var(--ink);text-align:left;cursor:pointer;line-height:1.45;
  }
  .link:hover{border-color:var(--brand)}
  .warn{
    font-size:12.5px;color:var(--loss);margin:8px 2px 0;line-height:1.4;
  }
  .ttab{
    display:inline-flex;align-items:center;flex:none;
    border:1px solid var(--line);background:var(--card);border-radius:999px;
    color:var(--muted);overflow:hidden;
  }
  .ttab[data-on="1"]{background:var(--ball);border-color:var(--ball-strong);color:var(--ball-ink)}
  .ttab .tname{
    border:0;background:transparent;cursor:pointer;padding:5px 4px 5px 13px;
    font-size:13.5px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;
  }
  .ttab[data-on="1"] .tname{font-weight:700}
  .ttab .x{
    border:0;background:transparent;cursor:pointer;width:24px;height:26px;
    display:grid;place-items:center;font-size:15px;line-height:1;color:inherit;opacity:.5;padding:0;
  }
  .ttab .x:hover{opacity:1}
  .tnew{
    flex:none;border:1px dashed var(--line);background:transparent;border-radius:999px;
    padding:5px 13px;cursor:pointer;color:var(--muted);font-size:13.5px;white-space:nowrap;
  }
  .tnew:hover{border-color:var(--brand);color:var(--brand)}

  /* ---------- piezas comunes ---------- */
  .eyebrow{
    font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);
  }
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .sep{height:1px;background:var(--line-soft)}

  .btn{
    border:1px solid var(--line);background:var(--card);border-radius:11px;
    padding:11px 15px;cursor:pointer;font-weight:600;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn:hover{border-color:var(--muted)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn[disabled]:hover{border-color:var(--line)}
  .btn-primary{
    background:var(--ball);color:var(--ball-ink);border-color:var(--ball-strong);
    font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;
    font-size:17px;font-weight:700;padding:13px 18px;
  }
  .btn-primary:hover{background:var(--ball-strong);border-color:var(--ball-strong)}
  .btn-ghost{background:transparent}
  .btn-wide{width:100%}
  .btn-sm{padding:7px 11px;font-size:13.5px;border-radius:9px}
  .btn-danger{color:var(--loss);border-color:color-mix(in srgb, var(--loss) 35%, var(--line))}

  .field{
    width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);
  }
  .field::placeholder{color:var(--muted)}
  label.lbl,.lbl{
    display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--brand);opacity:.85;margin:0 0 6px 2px;
  }

  /* ---------- clave del torneo ---------- */
  .btn-wa{
    background:#25D366;color:#062d17;border-color:#1eb457;
    font-weight:700;text-decoration:none;
  }
  .btn-wa:hover{background:#1eb457;border-color:#1eb457}
  .clave-caja{
    background:var(--brand-wash);border:1px solid color-mix(in srgb, var(--brand) 28%, var(--line));
    border-radius:var(--r);padding:14px;text-align:center;margin-bottom:12px;
  }
  .clave-val{
    font-family:var(--f-display);font-size:44px;font-weight:700;letter-spacing:.16em;
    line-height:1.05;color:var(--brand);
  }
  .clave-sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:6px}

  .clave-aviso{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    background:var(--brand-wash);border:1px solid color-mix(in srgb, var(--brand) 28%, var(--line));
    border-radius:var(--r);
  }
  .clave-aviso-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .clave-aviso b{
    font-family:var(--f-display);font-size:27px;font-weight:700;letter-spacing:.14em;
    line-height:1;color:var(--brand);
  }
  .clave-x{
    flex:none;border:0;background:transparent;cursor:pointer;color:var(--muted);
    font-size:18px;line-height:1;padding:4px 2px;
  }
  .clave-x:hover{color:var(--ink)}

  /* ---------- portada de bienvenida ---------- */
  .hero2{
    text-align:center;padding:26px 18px 22px;border-radius:var(--r);
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .hero2-bola{
    width:54px;height:54px;border-radius:50%;margin:0 auto 16px;position:relative;
    background:var(--ball);box-shadow:inset 0 0 0 2px var(--ball-strong);
  }
  .hero2-bola::after{
    content:"";position:absolute;inset:7px;border-radius:50%;
    border:2px solid transparent;border-left-color:var(--card);border-right-color:var(--card);
    transform:rotate(28deg);
  }
  .hero2 h2{
    font-family:var(--f-display);font-size:clamp(30px,8.5vw,40px);line-height:1;
    text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px;color:var(--ink);
    text-wrap:balance;
  }
  .hero2 p{
    margin:0 auto 20px;max-width:30ch;color:var(--muted);font-size:14.5px;line-height:1.45;
  }
  .hero2-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
  .hero2-chips span{
    font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);background:var(--card-2);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;
  }

  .clave-card{border-color:color-mix(in srgb, var(--brand) 30%, var(--line))}

  .pasos{display:flex;flex-direction:column;gap:14px}
  .paso{display:flex;gap:12px;align-items:flex-start}
  .paso-n{
    flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:var(--ball);color:var(--ball-ink);
    font-family:var(--f-display);font-size:14px;font-weight:700;
  }
  .paso b{
    display:block;font-family:var(--f-display);font-size:18px;font-weight:700;
    text-transform:uppercase;letter-spacing:.01em;color:var(--ink);line-height:1.15;
  }
  .paso span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}

  /* ---------- ajustes ---------- */
  .firma{
    padding:26px 20px 24px;text-align:center;
    background:var(--brand-wash);
    border:1px solid color-mix(in srgb, var(--brand) 26%, var(--line));
  }
  .firma-bola{
    width:46px;height:46px;border-radius:50%;margin:0 auto 12px;position:relative;
    background:var(--ball);box-shadow:inset 0 0 0 2px var(--ball-strong);
  }
  .firma-bola::after{
    content:"";position:absolute;inset:6px;border-radius:50%;
    border:2px solid transparent;border-left-color:var(--card);border-right-color:var(--card);
    transform:rotate(28deg);
  }
  .firma-app{
    font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--brand);line-height:1;
  }
  .firma-ver{
    display:inline-block;margin-top:9px;padding:3px 11px;border-radius:999px;
    background:var(--card);border:1px solid color-mix(in srgb, var(--brand) 26%, var(--line));
    font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  }
  .firma-sep{
    width:44px;height:2px;margin:20px auto 16px;border-radius:2px;background:var(--ball);
  }
  .firma-lbl{
    font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);
  }
  .firma-yo{
    font-family:var(--f-display);font-size:27px;font-weight:700;letter-spacing:.02em;
    text-transform:uppercase;color:var(--ink);margin-top:5px;line-height:1.05;
  }
  .firma-pie{
    margin-top:16px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);
  }
  .colores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .col-op{
    border:1px solid var(--line);background:var(--card);border-radius:11px;cursor:pointer;
    padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;
    font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);
  }
  .col-op i{width:22px;height:22px;border-radius:50%;display:block}
  .col-op[data-c="lima"] i{background:#C9E22B;box-shadow:inset 0 0 0 1px #B6CE1E}
  .col-op[data-c="azul"] i{background:#1D6FA5}
  .col-op[data-c="naranja"] i{background:#C2600F}
  .col-op[data-c="rosa"] i{background:#B32F70}
  .col-op.on{border-color:var(--ink);color:var(--ink)}
  .col-op:hover{border-color:var(--muted)}

  /* ---------- portada ---------- */
  .clave-in{
    font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;text-align:center;
  }
  .clave-in::placeholder{letter-spacing:.14em;font-size:20px;color:var(--muted)}
  .hint.mal{color:var(--loss)}

  .torl{display:flex;flex-direction:column}
  .tor{display:flex;align-items:stretch;border-bottom:1px solid var(--line-soft)}
  .tor:last-child{border-bottom:0}
  .tor-ir{
    flex:1;min-width:0;text-align:left;background:transparent;border:0;cursor:pointer;
    padding:11px 13px;display:flex;flex-direction:column;gap:2px;
  }
  .tor-ir:hover{background:var(--card-2)}
  .tor-n{
    font-family:var(--f-display);font-size:19px;text-transform:uppercase;font-weight:600;
    letter-spacing:.01em;overflow-wrap:anywhere;
  }
  .tor-m{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
  .tor-wa{
    flex:none;width:44px;border:0;border-left:1px solid var(--line-soft);background:transparent;
    display:grid;place-items:center;color:#25D366;text-decoration:none;
  }
  .tor-wa:hover{background:var(--card-2)}
  .tor-wa svg{display:block}
  .tor-x{
    flex:none;width:42px;border:0;border-left:1px solid var(--line-soft);background:transparent;
    cursor:pointer;color:var(--muted);font-size:17px;line-height:1;
  }
  .tor-x:hover{color:var(--loss);background:var(--card-2)}

  /* ---------- fichas de jugadores ---------- */
  .roster{display:flex;flex-wrap:wrap;gap:7px}
  .rgroup{display:inline-flex;align-items:center;gap:1px}
  .rchip{
    border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 14px;cursor:pointer;color:var(--muted);
    font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.01em;
    display:inline-flex;align-items:center;gap:6px;
  }
  .rchip:hover{border-color:var(--muted);color:var(--ink)}
  .rchip.on{background:var(--ball);border-color:var(--ball-strong);color:var(--ball-ink);font-weight:700}
  .rchip.on::before{content:"✓";font-family:var(--f-body);font-size:11px;font-weight:700}
  .rchip.played{cursor:default}
  .rx{
    border:1px solid var(--line);border-left:0;background:var(--card);cursor:pointer;
    border-radius:0 999px 999px 0;padding:6px 9px 6px 5px;color:var(--loss);line-height:1;font-size:15px;
  }
  .rgroup .rchip{border-radius:999px 0 0 999px}
  .rx:hover{background:var(--card-2)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;background:var(--card-2);
    border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-size:14.5px;
  }
  .chip b{font-weight:600}
  .chip button{
    border:0;background:transparent;cursor:pointer;color:var(--muted);
    width:20px;height:20px;border-radius:50%;display:grid;place-items:center;line-height:1;font-size:15px;
  }
  .chip button:hover{background:var(--line);color:var(--ink)}

  .counter{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
  .counter.ok{color:var(--win)}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt-full{grid-column:1/-1}

  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
  .seg button{
    flex:1;border:0;background:transparent;padding:10px 8px;cursor:pointer;font-size:14px;font-weight:600;
    color:var(--muted);
  }
  .seg button + button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--brand-wash);color:var(--brand)}
  .hint{font-size:13px;color:var(--muted);margin:6px 2px 0;line-height:1.4}

  /* ---------- cancha ---------- */
  .court{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .court-head{
    display:flex;align-items:center;gap:8px;padding:9px 13px;
    background:var(--card-2);border-bottom:1px solid var(--line-soft);
  }
  .court-head .n{
    font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;
    font-size:14px;font-weight:700;color:var(--brand);
  }
  .court-head .t{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

  .side{
    display:flex;align-items:center;gap:10px;padding:12px 13px;
    background:var(--turf);position:relative;
  }
  .side.win{background:var(--ball-wash);box-shadow:inset 3px 0 0 var(--ball)}
  .names{flex:1;min-width:0}
  .names .p{
    font-family:var(--f-display);font-size:20px;line-height:1.15;letter-spacing:.01em;
    text-transform:uppercase;font-weight:600;overflow-wrap:anywhere;
  }
  .side.win .names .p{font-weight:700}

  .scv{
    flex:none;width:54px;height:46px;display:grid;place-items:center;border-radius:10px;
    border:1px solid var(--line);background:var(--card);
    font-family:var(--f-display);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--muted);
  }
  .side.win .scv{color:var(--ball-ink);border-color:var(--ball-strong);background:var(--ball)}
  /* Aviso de un instante cuando el organizador acaba de anotar aquí. */
  .scv.just{animation:destello 1.1s ease-out}
  @keyframes destello{
    0%   { border-color:var(--live); box-shadow:0 0 0 0 color-mix(in srgb, var(--live) 65%, transparent); }
    100% { box-shadow:0 0 0 12px color-mix(in srgb, var(--live) 0%, transparent); }
  }

  .scorebox{display:flex;align-items:center;gap:6px;flex:none}
  .stp{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;display:grid;place-items:center;font-size:18px;line-height:1;color:var(--muted);
  }
  .stp:hover{color:var(--ink);border-color:var(--muted)}
  .sc{
    width:52px;height:46px;text-align:center;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-family:var(--f-display);font-size:27px;font-weight:700;
    font-variant-numeric:tabular-nums;padding:0;
  }
  .sc:focus{border-color:var(--brand);outline:none}
  .court-head .t.mal{color:var(--loss)}

  .net{
    height:14px;
    background-image:
      repeating-linear-gradient(45deg, var(--net) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, var(--net) 0 1px, transparent 1px 6px);
    border-top:2px solid var(--net-cord);
    border-bottom:1px solid var(--line);
    opacity:.85;
  }

  .rest{
    display:flex;flex-wrap:wrap;align-items:center;gap:7px;
    padding:11px 13px;border:1px dashed var(--line);border-radius:var(--r);
  }
  .rest .r{
    font-family:var(--f-display);text-transform:uppercase;font-size:16px;letter-spacing:.02em;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 11px;
  }

  /* ---------- navegación de rondas ---------- */
  .rnav{display:flex;align-items:center;gap:8px}
  .rnav .t{
    flex:1;text-align:center;font-family:var(--f-display);text-transform:uppercase;
    letter-spacing:.1em;font-size:18px;font-weight:700;
  }
  .rnav .t small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:400}
  .nav-btn{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;display:grid;place-items:center;color:var(--ink);flex:none;
  }
  .nav-btn[disabled]{opacity:.3;cursor:not-allowed}

  /* ---------- cuadro ---------- */
  .card.now{border-color:var(--brand)}
  /* Dos rondas por fila cuando hay sitio; en móvil estrecho, una. */
  .cuadro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .fx{
    display:grid;grid-template-columns:auto 1fr;align-items:start;gap:7px;
    padding:7px 9px;border-bottom:1px solid var(--line-soft);
  }
  .fx-c{
    font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);
    background:var(--card-2);border-radius:5px;padding:3px 5px;margin-top:1px;
  }
  .fxg{min-width:0;display:flex;flex-direction:column;gap:2px}
  .fxl{display:flex;align-items:baseline;gap:6px}
  .fxn{
    flex:1;min-width:0;font-family:var(--f-display);font-size:14.5px;line-height:1.15;
    text-transform:uppercase;letter-spacing:.01em;color:var(--muted);overflow-wrap:anywhere;
  }
  .fxl.w .fxn{color:var(--ink);font-weight:700}
  .fxn i{font-style:normal;opacity:.45;padding:0 1px}
  .fxp{
    flex:none;font-family:var(--f-display);font-size:16px;font-weight:700;
    font-variant-numeric:tabular-nums;min-width:14px;text-align:right;
  }
  .fxl.w .fxp{color:var(--win)}
  .fxp.pend{color:var(--muted);font-weight:400}
  .fx-rest{
    padding:6px 9px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);
    background:var(--card-2);line-height:1.35;
  }
  .cuadro-grid .court-head{padding:6px 9px;gap:6px}
  .cuadro-grid .court-head .n{font-size:13px;white-space:nowrap}
  .cuadro-grid .court-head .t{display:none}        /* el marcador ya lo dice */
  .cuadro-grid .court-head .btn{
    margin-left:auto;padding:2px 8px !important;font-size:11px;white-space:nowrap;
  }
  .cuadro-grid .fx-c{font-size:9px;padding:2px 4px}
  /* La ronda que estás jugando, marcada de un vistazo. */
  .cuadro-grid .card.now .court-head{background:var(--brand-wash)}
  .repl{display:flex;flex-direction:column}
  .rep{
    display:flex;align-items:baseline;gap:10px;padding:7px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .rep:last-child{border-bottom:0}
  .rep .nm{
    flex:1;min-width:0;font-family:var(--f-display);font-size:17px;text-transform:uppercase;
    font-weight:600;overflow-wrap:anywhere;
  }
  .rep .n1,.rep .n2{
    flex:none;font-family:var(--f-display);font-size:17px;font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;
  }
  .rep .n1{min-width:78px}
  .rep .n2{min-width:92px}
  .rep i{
    font-style:normal;font-family:var(--f-mono);font-size:10px;font-weight:400;
    color:var(--muted);letter-spacing:.02em;
  }
  .rep.mas .n1{color:var(--win)}
  .rep.menos .n1{color:var(--loss)}

  /* ---------- tabla ---------- */
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  thead th{
    font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:400;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  thead th:nth-child(1),thead th:nth-child(2){text-align:left}
  tbody td{padding:10px 8px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:var(--f-mono);font-size:14px}
  tbody td.pos{
    text-align:left;width:34px;font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--muted);
  }
  tbody td.nm{
    text-align:left;font-family:var(--f-display);font-size:19px;font-weight:600;text-transform:uppercase;
    letter-spacing:.01em;
  }
  tbody td.pts{font-family:var(--f-display);font-size:20px;font-weight:700}
  tbody td.gana{color:var(--win);font-weight:700}
  tbody tr.lead td{background:var(--gold-bg)}
  tbody tr.lead td.pos{color:var(--gold);position:relative}
  tbody tr.lead td.pos::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
  tbody tr.plata td.pos{color:var(--silver)}
  tbody tr.bronce td.pos{color:var(--bronze)}
  tbody tr.out td{opacity:.5}
  tbody tr:last-child td{border-bottom:0}

  .champ{
    padding:15px;border-radius:var(--r);background:var(--card);
    border:1px solid var(--line);border-top:3px solid var(--gold);box-shadow:var(--shadow);
  }
  .champ .eyebrow{color:var(--muted)}

  /* ---------- jugadores ---------- */
  .plist{display:flex;flex-direction:column}
  .prow{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line-soft)}
  .prow:last-child{border-bottom:0}
  .prow .nm{
    flex:1;min-width:0;font-family:var(--f-display);font-size:19px;text-transform:uppercase;font-weight:600;
    overflow-wrap:anywhere;
  }
  .prow.off .nm{opacity:.45;text-decoration:line-through}
  .prow .pos{
    flex:none;width:20px;font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--muted);
  }
  .prow .pt{
    flex:none;font-family:var(--f-display);font-size:20px;font-weight:700;
    font-variant-numeric:tabular-nums;min-width:32px;text-align:right;
  }
  .prow:first-child .pt{color:var(--ink)}
  .prow:first-child{background:var(--gold-bg)}
  .prow:first-child .pos{color:var(--gold)}
  .prow:nth-child(2) .pos{color:var(--silver)}
  .prow:nth-child(3) .pos{color:var(--bronze)}

  .prog{
    height:9px;border-radius:999px;background:var(--card-2);
    border:1px solid var(--line);overflow:hidden;
  }
  .prog i{display:block;height:100%;background:var(--ball);border-radius:999px;transition:width .35s ease}
  .lead-now{
    margin-top:8px;font-size:14px;color:var(--muted);
  }
  .lead-now b{
    font-family:var(--f-display);font-size:19px;text-transform:uppercase;color:var(--ink);
    letter-spacing:.01em;
  }

  .box{padding:13px}
  .box h3{
    font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:15px;
    margin:0 0 10px;color:var(--brand);
  }
  .box h3 .side-note{
    float:right;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;
    color:var(--muted);text-transform:none;font-weight:400;
  }

  /* ---------- pestañas inferiores ---------- */
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--paper);
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:saturate(1.4) blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 6px}
  /* El espectador no tiene inicio: no es su app. */
  body.ro .tabs-in{grid-template-columns:repeat(3,1fr)}
  body.ro .tab-inicio{display:none}
  .tab-inicio .ic{font-size:19px}
  /* Compartir vive arriba a la derecha, junto al tema. */
  .theme-btn.on{background:var(--ball);border-color:var(--ball-strong);color:var(--ball-ink)}
  .theme-btn svg{pointer-events:none;display:block}
  .tab{
    border:0;background:transparent;padding:9px 2px 12px;cursor:pointer;width:100%;
    display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);
  }
  .tab span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
  .tab[aria-selected="true"]{color:var(--ink)}
  .tab[aria-selected="true"] .ic{background:var(--ball);border-color:var(--ball-strong);color:var(--ball-ink)}
  .ic{
    width:100%;max-width:74px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;
    font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.04em;
  }

  /* ---------- diálogo de confirmación ---------- */
  .modal{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    padding:18px;background:rgba(6,20,28,.55);backdrop-filter:blur(3px);
  }
  .modal[hidden]{display:none}
  .sheet{
    width:100%;max-width:380px;padding:18px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }
  .sheet h3{
    font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:19px;
    margin:0 0 6px;text-wrap:balance;
  }
  .sheet p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
  .sheet p:empty{display:none;margin:0}
  .btn-brand{background:var(--brand);color:var(--card);border-color:var(--brand)}
  .btn-brand:hover{border-color:var(--brand);filter:brightness(1.08)}

  .podium{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .pod{
    display:flex;align-items:center;gap:11px;padding:10px 12px;
    border-radius:11px;border:1px solid var(--line);
  }
  .pod .medal{
    flex:none;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;
    font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.01em;
  }
  .pod .who{
    flex:1;min-width:0;font-family:var(--f-display);font-size:21px;line-height:1.1;
    text-transform:uppercase;font-weight:700;color:var(--ink);overflow-wrap:anywhere;
  }
  .pod .who small{
    display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;
    text-transform:none;letter-spacing:.02em;color:var(--muted);margin-top:3px;
  }
  .pod .pts{
    flex:none;font-family:var(--f-display);font-size:23px;font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .pod.p1{border-color:var(--gold);background:var(--gold-bg)}
  .pod.p1 .medal{background:var(--gold);color:var(--gold-on)}
  .pod.p1 .who{font-size:25px}
  .pod.p2{border-color:var(--silver);background:var(--silver-bg)}
  .pod.p2 .medal{background:var(--silver);color:var(--silver-on)}
  .pod.p3{border-color:var(--bronze);background:var(--bronze-bg)}
  .pod.p3 .medal{background:var(--bronze);color:var(--bronze-on)}

  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:999px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:40;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>


<header class="bar">
  <div class="bar-in">
    <div class="mark">
      <div class="ball-dot" aria-hidden="true"></div>
      <div>
        <h1>Padelito</h1>
        <small id="sub">americano · 0 jugadores</small>
      </div>
    </div>

<script>
(function(){
"use strict";

/* ============================================================
   Estado. DB guarda todos los torneos; S es el torneo abierto.
   ============================================================ */
var LS = "puntodeoro.v1";
var VERSION = "1.0";

/* Los de siempre. Se pueden quitar y añadir desde la app. */
var DEFAULT_ROSTER = ["Freddy","Panza","CB9","Juan","Hotch","Pecas","Rafa","Mau","Richi","Diego","Steve","Leo"];

var DB = load() || freshDB();
var S  = DB.tournaments[DB.active];
var tab = "ronda";
var editRoster = false;

function uid(){ return Math.random().toString(36).slice(2,9); }

/* Nombre por defecto: la fecha de hoy, 16/08/26. Si ya hay uno, (2), (3)… */
function dateName(){
  var d = new Date(), p = function(x){ return ("0" + x).slice(-2); };
  var base = p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + String(d.getFullYear()).slice(-2);
  var lista = (typeof DB !== "undefined" && DB && DB.tournaments) ? DB.tournaments : [];
  var n = 1, nombre = base;
  while(lista.some(function(t){ return t.name === nombre; })){ n++; nombre = base + " (" + n + ")"; }
  return nombre;
}
function freshT(n){
  return {
    id: uid(),
    name: dateName(),
    players: [],          // {id,name,active}
    format: "americano",
    courts: 1,
    courtsAuto: true,
    minutes: 120,
    roundPoints: 5,
    scoring: "puntos",
    roundsAuto: true,
    roundsWanted: 12,
    rounds: [],           // {rest:[id], matches:[{a:[id,id],b:[id,id],sa,sb}]}
    cur: 0,
    started: false,
    finished: false
  };
}
function freshDB(){
  return { v:2, seq:1, active:0, theme:null, accent:"lima", escala:1,
           roster:DEFAULT_ROSTER.slice(), tournaments:[], seguidos:[] };
}

function load(){
  try{
    var raw = localStorage.getItem(LS);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(o && o.v === 2 && Array.isArray(o.tournaments)){
      o.tournaments.forEach(normalizeT);
      // Los que quedaron a medias sin un solo jugador no aportan nada a la lista.
      o.tournaments = o.tournaments.filter(function(t){
        return t.started || t.players.length > 0;
      });
      o.active = Math.max(0, Math.min(o.active || 0, Math.max(0, o.tournaments.length - 1)));
      seedRoster(o);
      if(!Array.isArray(o.seguidos)) o.seguidos = [];
      var limite = Date.now() - 24 * 3600 * 1000;
      o.seguidos = o.seguidos.filter(function(x){ return x && x.ts > limite; });
      return o;
    }
    // Torneo suelto guardado con la versión anterior: lo envolvemos.
    if(o && Array.isArray(o.players)){
      var th = o.theme || null;
      delete o.theme;
      o.id = uid(); o.name = dateName();
      normalizeT(o);
      var db = { v:2, seq:2, active:0, theme:th, tournaments:[o] };
      seedRoster(db);
      return db;
    }
    return null;
  }catch(e){ return null; }
}
/* La lista arranca con los de siempre y se completa con quien ya haya jugado. */
function seedRoster(db){
  if(!Array.isArray(db.roster)) db.roster = DEFAULT_ROSTER.slice();
  db.tournaments.forEach(function(t){
    t.players.forEach(function(p){
      if(!db.roster.some(function(r){ return sameName(r, p.name); })) db.roster.push(p.name);
    });
  });
}
function normalizeT(t){
  if(!t || !Array.isArray(t.players)) return;
  if(!Array.isArray(t.rounds)) t.rounds = [];
  if(t.courtsAuto === undefined) t.courtsAuto = true;
  if(t.minutes === undefined){
    t.minutes = t.plannedRounds ? Math.max(60, Math.min(120, t.plannedRounds * 15)) : 120;
  }
  delete t.matchMins;
  if(t.roundPoints === undefined) t.roundPoints = 5;
  if(t.scoring !== "partidos") t.scoring = "puntos";
  if(t.roundsAuto === undefined) t.roundsAuto = true;
  if(t.roundsWanted === undefined) t.roundsWanted = 12;
  delete t.target; delete t.freeScore;
  delete t.plannedRounds;
  if(!t.name) t.name = "Torneo";
  if(!t.id) t.id = uid();
  t.players.forEach(function(p){ delete p.level; });
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(DB)); }catch(e){}
  if(!RO && S && S.remote) push(false);
}
/* Apariencia: tema, color de acento y tamaño de letra. */
function aplicarApariencia(){
  var r = document.documentElement;
  if(DB.theme) r.setAttribute("data-theme", DB.theme); else r.removeAttribute("data-theme");
  r.setAttribute("data-accent", DB.accent || "lima");
  var v = document.getElementById("view");
  if(v) v.style.zoom = (DB.escala && DB.escala !== 1) ? DB.escala : "";
}
function openT(i){
  if(!DB.tournaments.length){ DB.active = 0; S = null; enHome = true; return; }
  DB.active = Math.max(0, Math.min(i, DB.tournaments.length - 1));
  S = DB.tournaments[DB.active];
  tab = "ronda";
}

/* ============================================================
   Marcador en vivo.
   El organizador guarda la clave secreta en su dispositivo y es el
   único que puede escribir. Todos los demás abren el enlace público
   y reciben cada cambio al instante por websocket.
   ============================================================ */
/* Acciones que modifican el torneo. En modo espectador se bloquean en seco,
   aunque por un error de pintado llegara a aparecer el botón. */
var PROHIBIDO_MIRANDO = {
  add:1, del:1, fmt:1, start:1, redraw:1, prev:1, nextR:1, goto:1, bump:1,
  finish:1, reopen:1, newT:1, delT:1, switchT:1, publish:1, unpublish:1,
  rtoggle:1, rdel:1, rall:1, rnone:1, redit:1, next:1
};
var soyDueno = -1;              // índice del torneo local si tengo la clave
var enHome = true;              // se decide al arrancar, más abajo

var ROUTE = parseRoute();
var BACKEND = null;          // null = sin comprobar · false = alojamiento estático
var RO = false;              // modo espectador
var roLoaded = false;
var ws = null, wsTimer = null, pollTimer = null, pushTimer = null;

/* ¿Este alojamiento tiene servidor de marcador en vivo? En Netlify o en
   cualquier hosting estático no lo hay, y la app funciona igual pero solo
   en este teléfono. */
function checkBackend(){
  return fetch("/api/ping.json", { cache:"no-store" })
    .then(function(r){
      var t = r.headers.get("content-type") || "";
      return (r.ok && t.indexOf("json") >= 0) ? r.json() : null;
    })
    .then(function(j){ BACKEND = !!(j && j.ok); return BACKEND; })
    .catch(function(){ BACKEND = false; return false; });
}
function parseRoute(){
  var m = location.pathname.match(/^\/t\/([A-Za-z0-9_-]{3,64})/);
  if(!m) return null;
  var key = null;
  location.hash.replace(/^#/, "").split("&").forEach(function(kv){
    var p = kv.split("=");
    if(p[0] === "k") key = decodeURIComponent(p[1] || "");
  });
  return { slug: m[1], key: key };
}
function randHex(bytes){
  var a = new Uint8Array(bytes);
  window.crypto.getRandomValues(a);
  return Array.prototype.map.call(a, function(b){
    return ("0" + b.toString(16)).slice(-2);
  }).join("");
}
/* Clave de acceso: 5 caracteres fáciles de dictar por teléfono.
   Sin I, L, O, 0 ni 1 para que nadie los confunda. */
var ALFA_CLAVE = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function nuevaClave(){
  var a = new Uint8Array(5);
  window.crypto.getRandomValues(a);
  var out = "";
  for(var i = 0; i < 5; i++) out += ALFA_CLAVE.charAt(a[i] % ALFA_CLAVE.length);
  return out;
}
function limpiaClave(t){
  return String(t || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
}
function slugify(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "torneo";
}
function publicLink(){ return location.origin + "/t/" + S.remote.slug; }
function adminLink(){ return publicLink() + "#k=" + S.remote.key; }

function mensajeDe(t){
  return "🎾 " + t.name + "\nClave: " + t.remote.slug +
    "\n\nSigue el marcador en vivo:\n" + location.origin + "/t/" + t.remote.slug;
}
function mensajeGrupo(){ return mensajeDe(S); }
function mensajeResultados(){
  return "🎾 " + S.name +
    (S.remote ? "\nClave: " + S.remote.slug : "") +
    "\n\nRESULTADOS\n" +
    (S.remote ? "\n" + publicLink() : "");
}
function mensajeApp(){
  return "🎾 Padelito\nSorteo de parejas y marcador en vivo para pádel." +
    "\n\n" + location.origin;
}
function enlaceWhatsapp(){ return "https://wa.me/?text=" + encodeURIComponent(mensajeGrupo()); }
/* Se comparte siempre con enlaces normales, nunca con window.open: dentro
   de la app instalada eso deja una ventana en blanco al volver. */

function setLive(st){
  var el = document.getElementById("live");
  if(!el) return;
  el.hidden = !st;
  el.className = "live" + (st === "on" ? " on" : st === "off" ? " off" : "");
  el.querySelector("span").textContent = st === "on" ? "en vivo" : st === "off" ? "sin conexión" : "";
}
function payload(){
  var d = JSON.parse(JSON.stringify(S));
  delete d.remote;                 // la clave nunca sale de este dispositivo
  return d;
}
/* Qué marcadores han cambiado respecto a lo que ya teníamos, para poder
   destacarlos un instante en la pantalla de quien mira. */
var flash = {}, flashT = null;
function diffMarcadores(viejo, nuevo){
  var out = {};
  if(!viejo || !viejo.rounds || !nuevo || !nuevo.rounds) return out;
  nuevo.rounds.forEach(function(r, ri){
    var vr = viejo.rounds[ri];
    if(!vr) return;
    r.matches.forEach(function(m, mi){
      var vm = vr.matches[mi];
      if(!vm) return;
      if(vm.sa !== m.sa) out[ri + "-" + mi + "-a"] = 1;
      if(vm.sb !== m.sb) out[ri + "-" + mi + "-b"] = 1;
    });
  });
  return out;
}
/* Guarda la clave con la que acabas de entrar para no volver a teclearla
   el mismo día. Se limpian solas a las 24 horas. */
function recordarSeguido(clave, nombre){
  if(!Array.isArray(DB.seguidos)) DB.seguidos = [];
  DB.seguidos = DB.seguidos.filter(function(x){ return x.clave !== clave; });
  DB.seguidos.unshift({ clave:clave, nombre:nombre || clave, ts:Date.now() });
  DB.seguidos = DB.seguidos.slice(0, 8);
  try{ localStorage.setItem(LS, JSON.stringify(DB)); }catch(e){}
}
function aplicarRemoto(nuevo){
  if(!nuevo) return;
  normalizeT(nuevo);
  if(RO && ROUTE) recordarSeguido(ROUTE.slug, nuevo.name);
  flash = diffMarcadores(S, nuevo);
  S = nuevo;
  roLoaded = true;
  setLive("on");
  render();
  clearTimeout(flashT);
  flashT = setTimeout(function(){ flash = {}; }, 1200);   // sin repintar: la animación ya acabó
}

function push(now){
  if(!S || !S.remote || RO) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){
    fetch("/api/t/" + S.remote.slug, {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ key: S.remote.key, data: payload() })
    }).then(function(r){
      if(r.status === 403){ setLive("off"); toast("Ese enlace ya tiene otro organizador"); return; }
      setLive(r.ok ? "on" : "off");
    }).catch(function(){ setLive("off"); });
  }, now ? 0 : 220);
}
function publish(){
  if(S.remote){ push(true); render(); return; }
  var intentos = 0;
  toast("Generando clave…");
  (function probar(){
    var c = nuevaClave();
    fetch("/api/t/" + c, { cache:"no-store" }).then(function(r){
      if(r.status === 404){                    // libre
        S.remote = { slug:c, key:randHex(16) };
        save(); push(true); render();
        toast("Clave del torneo: " + c);
      }else if(++intentos < 6){
        probar();                              // ocupada, probamos otra
      }else{
        toast("No se pudo generar la clave, prueba otra vez");
      }
    }).catch(function(){ toast("Sin conexión"); });
  })();
}
function stopSharing(){
  ask({
    title: "Dejar de compartir",
    body: "Se borra el marcador del servidor y el enlace deja de funcionar. El torneo se queda en este teléfono.",
    ok: "Dejar de compartir", danger: true,
    onOk: function(){
      var slug = S.remote.slug, key = S.remote.key;
      fetch("/api/t/" + slug + "?k=" + encodeURIComponent(key), { method: "DELETE" }).catch(function(){});
      delete S.remote;
      setLive("");
      save(); render();
    }
  });
}
function connect(slug){
  if(ws) return;
  try{
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/api/t/" + slug + "/ws");
  }catch(e){ setLive("off"); return; }

  ws.onopen = function(){ setLive("on"); try{ ws.send("hola"); }catch(e){} };
  ws.onmessage = function(e){
    var m; try{ m = JSON.parse(e.data); }catch(err){ return; }
    if(m.type === "state" && RO){
      aplicarRemoto(m.data);
    }else if(m.type === "deleted" && RO){
      setLive("off"); toast("El organizador dejó de compartir este marcador");
    }
  };
  ws.onerror = function(){ try{ ws.close(); }catch(e){} };
  ws.onclose = function(){
    ws = null; setLive("off");
    clearTimeout(wsTimer);
    wsTimer = setTimeout(function(){ connect(slug); }, 3000);
  };
}
/* Por si el websocket no llega (wifi del club, iPhone bloqueado…) */
function pull(slug){
  fetch("/api/t/" + slug).then(function(r){
    if(!r.ok) throw new Error("404");
    return r.json();
  }).then(function(j){
    aplicarRemoto(j.data);
  }).catch(function(){
    if(!roLoaded){
      roLoaded = "error"; render();
    }
    setLive("off");
  });
}
function adoptRemote(slug, key){
  fetch("/api/t/" + slug).then(function(r){
    if(!r.ok) throw new Error("404");
    return r.json();
  }).then(function(j){
    var t = j.data;
    normalizeT(t);
    t.remote = { slug: slug, key: key };
    DB.tournaments.push(t);
    openT(DB.tournaments.length - 1);
    seedRoster(DB);
    save(); render();
    toast("Torneo cargado");
  }).catch(function(){
    toast("Ese torneo ya no existe");
  });
}

/* ---------- utilidades ---------- */
function sameName(a,b){ return String(a).trim().toLowerCase() === String(b).trim().toLowerCase(); }
function byId(id){ for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return S.players[i]; return null; }
function playerNamed(nm){
  for(var i=0;i<S.players.length;i++) if(sameName(S.players[i].name, nm)) return S.players[i];
  return null;
}
function rosterAdd(nm){
  nm = String(nm||"").trim().replace(/\s+/g," ").slice(0,18);
  if(nm && !DB.roster.some(function(r){ return sameName(r, nm); })) DB.roster.push(nm);
}
function nameOf(id){ var p = byId(id); return p ? p.name : "?"; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function actives(){ return S.players.filter(function(p){ return p.active; }); }

/* Canchas: una por cada 4 jugadores, máximo 3.
   Menos de 8 → 1 cancha · de 8 a 11 → 2 · 12 → 3. */
function maxCourts(){ return Math.max(1, Math.min(3, Math.floor(Math.max(actives().length, 4) / 4))); }
function syncCourts(){
  var mx = maxCourts();
  S.courts = S.courtsAuto ? mx : Math.max(1, Math.min(S.courts, mx));
  return S.courts;
}
function setupLine(){
  var n = actives().length;
  if(n < 4) return "Faltan " + (4 - n) + " para poder empezar.";
  var c = syncCourts(), rest = n - c * 4;
  return n + " jugadores · " + c + (c === 1 ? " cancha" : " canchas") + " · juegan " + (c * 4) +
    (rest ? " y descansa" + (rest === 1 ? " 1" : "n " + rest) + " por turnos" : ", nadie descansa");
}

/* Cuánta gente descansa en cada ronda. */
function restPerRound(){ return Math.max(0, actives().length - syncCourts() * 4); }

function gcd(a,b){ while(b){ var t = b; b = a % b; a = t; } return a; }

/* Para que todos descansen EXACTAMENTE lo mismo, el total de descansos
   (rondas × los que descansan) tiene que repartirse justo entre los jugadores.
   Eso solo pasa cada 'ciclo' rondas; elegimos el múltiplo más cercano al que
   cabe en el tiempo. Con 9 jugadores el ciclo es de 9, con 11 de 11, etc. */
function restCycle(){
  var n = actives().length, rest = restPerRound();
  if(n < 4 || rest === 0) return 1;      // nadie descansa: vale cualquier número
  return n / gcd(rest, n);
}
var MIN_R = 8, MAX_R = 18;

function rawRounds(){
  // Una ronda ronda los 10 minutos de media. Solo sirve para proponer un número
  // de rondas a partir de lo que reservaste; unos partidos durarán más y otros menos.
  return Math.max(MIN_R, Math.min(MAX_R, Math.round(S.minutes / 10)));
}
/* Rondas entre 8 y 14 en las que todos acaban con los mismos partidos
   y los mismos descansos. */
function fairRounds(){
  var cyc = restCycle(), out = [];
  for(var r = MIN_R; r <= MAX_R; r++) if(r % cyc === 0) out.push(r);
  return out;
}
function isFair(r){ return r % restCycle() === 0; }

/* Para coincidir con los N−1 demás hay que jugar al menos N−1 partidos.
   Devuelve el menor número de rondas parejo que lo consigue, o null si con
   esta cantidad de gente no hay ninguno dentro del rango. */
function rondasTodosConTodos(){
  var n = actives().length, rest = restPerRound(), fair = fairRounds();
  for(var i = 0; i < fair.length; i++){
    if(fair[i] - rest * fair[i] / n >= n - 1) return fair[i];
  }
  return null;
}
/* La sugerencia: de las parejas, la que más se acerca al tiempo reservado. */
function autoRounds(){
  var target = rawRounds(), fair = fairRounds();
  if(!fair.length) return target;
  var best = fair[0];
  fair.forEach(function(r){ if(Math.abs(r - target) < Math.abs(best - target)) best = r; });
  return best;
}
function estRounds(){
  if(S.roundsAuto) return autoRounds();
  return Math.max(MIN_R, Math.min(MAX_R, S.roundsWanted || autoRounds()));
}
/* Una vez empezado, el cuadro no crece: manda lo que se sorteó. */
function goalRounds(){ return S.started && S.rounds.length ? S.rounds.length : estRounds(); }
function fmtDur(m){
  var h = Math.floor(m / 60), r = m % 60;
  return (h ? h + " h" + (r ? " " + r : "") : r + " min");
}
function nombreFormato(){ return S.format === "mexicano" ? "por nivel" : "americano"; }
function durLine(){
  var n = goalRounds();
  return n + " rondas · " + S.roundPoints + " puntos por ronda" +
    (S.scoring === "partidos" ? " · 3-1-0" : "");
}
/* Explica el ajuste cuando el número redondo de rondas no reparte bien los descansos. */
function roundsNote(){
  var n = actives().length;
  if(n < 4) return "";
  var rest = restPerRound(), rounds = goalRounds();
  if(rest === 0) return "Los " + n + " juegan los " + rounds + " partidos. Nadie descansa.";

  var total = rounds * rest, base = Math.floor(total / n), sobran = total % n;
  if(sobran === 0){
    return "Cada uno juega " + (rounds - base) + " partidos y descansa " +
      base + (base === 1 ? " vez" : " veces") + ". Exactamente igual para todos.";
  }
  var fair = fairRounds();
  return "Con " + rounds + " rondas no sale parejo: " + sobran +
    (sobran === 1 ? " descansaría " : " descansarían ") + (base + 1) +
    " veces y el resto " + base + ". Sale exacto con " +
    (fair.length ? fair.join(" o ") + " rondas." : "otro número de jugadores.");
}

/* ============ estadísticas ============ */
function stats(){
  var m = {};
  S.players.forEach(function(p){ m[p.id] = { id:p.id, pts:0, juego:0, pj:0, g:0, e:0, l:0, rest:0 }; });
  S.rounds.forEach(function(r){
    r.rest.forEach(function(id){ if(m[id]) m[id].rest++; });
    r.matches.forEach(function(mt){
      if(mt.sa === null || mt.sb === null) return;
      [[mt.a, mt.sa, mt.sb], [mt.b, mt.sb, mt.sa]].forEach(function(s){
        s[0].forEach(function(id){
          var e = m[id]; if(!e) return;
          e.juego += s[1]; e.pj++;
          if(s[1] > s[2]) e.g++; else if(s[1] === s[2]) e.e++; else e.l++;
        });
      });
    });
  });
  Object.keys(m).forEach(function(k){
    var e = m[k];
    /* Por puntos: cuenta lo que ganaste en la cancha.
       Por partidos: 3 al ganar, 1 al empatar, 0 al perder — da igual por cuánto. */
    e.pts = (S.scoring === "partidos") ? (e.g * 3 + e.e) : e.juego;
    e.prom = e.pj ? e.pts / e.pj : 0;   // solo desempata si alguien jugó menos
  });
  return m;
}
function ranking(){
  var st = stats();
  return S.players.map(function(p){
    var e = st[p.id];
    return { p:p, pts:e.pts, juego:e.juego, pj:e.pj, g:e.g, e:e.e, l:e.l,
             prom:e.prom, rest:e.rest };
  }).sort(function(x,y){
    if(S.scoring === "partidos"){
      // Empatados a puntos de tabla, sube quien más puntos hizo en la cancha.
      return (y.pts - x.pts) || (y.juego - x.juego) || (y.g - x.g) ||
             x.p.name.localeCompare(y.p.name, "es");
    }
    return (y.pts - x.pts) || (y.g - x.g) || (y.e - x.e) || (y.prom - x.prom) ||
           x.p.name.localeCompare(y.p.name, "es");
  });
}

/* ============ historial de parejas y rivales ============ */
function key2(a,b){ return a < b ? a+"|"+b : b+"|"+a; }
function history(){
  var pc = {}, oc = {};
  S.rounds.forEach(function(r){
    r.matches.forEach(function(mt){
      var ka = key2(mt.a[0], mt.a[1]); pc[ka] = (pc[ka]||0)+1;
      var kb = key2(mt.b[0], mt.b[1]); pc[kb] = (pc[kb]||0)+1;
      mt.a.forEach(function(x){ mt.b.forEach(function(y){
        var k = key2(x,y); oc[k] = (oc[k]||0)+1;
      }); });
    });
  });
  return { pc:pc, oc:oc };
}

/* ============ sorteo de rondas ============ */
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
/* Coste de un partido: repetir compañero pesa mucho, repetir rival pesa poco.
   Al elevarlo al cuadrado, la tercera repetición duele más que la segunda. */
function matchCost(A, B, pc, oc){
  var c = 0;
  var pa = pc[key2(A[0],A[1])] || 0;
  var pb = pc[key2(B[0],B[1])] || 0;
  c += 140 * (pa*pa + pb*pb);
  for(var i=0;i<2;i++) for(var j=0;j<2;j++){
    var o = oc[key2(A[i],B[j])] || 0;
    c += 14 * (o*o);
  }
  return c;
}
var SPLITS = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];

function bestSplit(g, pc, oc, prefer){
  var best = null, bc = Infinity;
  for(var s=0;s<SPLITS.length;s++){
    var sp = SPLITS[s];
    var A = [g[sp[0][0]], g[sp[0][1]]];
    var B = [g[sp[1][0]], g[sp[1][1]]];
    var c = matchCost(A, B, pc, oc);
    if(prefer !== undefined && s !== prefer) c += 90;
    if(c < bc){ bc = c; best = { a:A, b:B, cost:c }; }
  }
  return best;
}
/* Cuántas veces ha jugado cada uno en cada cancha. */
function courtHistory(){
  var cc = {};
  S.rounds.forEach(function(r){
    r.matches.forEach(function(m, ci){
      m.a.concat(m.b).forEach(function(id){
        if(!cc[id]) cc[id] = [];
        cc[id][ci] = (cc[id][ci] || 0) + 1;
      });
    });
  });
  return cc;
}
/* Todas las formas de repartir k grupos entre k canchas. k es 1, 2 o 3. */
function permutaciones(k){
  if(k === 1) return [[0]];
  var out = [];
  permutaciones(k - 1).forEach(function(p){
    for(var i = 0; i <= p.length; i++){
      out.push(p.slice(0, i).concat([k - 1], p.slice(i)));
    }
  });
  return out;
}
var PERMS = { 1:permutaciones(1), 2:permutaciones(2), 3:permutaciones(3) };

/* De todas las formas de repartir estos grupos entre las canchas, la que deja
   a la gente más igualada. Devuelve el coste y el reparto ganador. */
function mejorReparto(groups, cc){
  var k = groups.length;
  if(!cc || k < 2) return { coste:0, perm:null };
  var mejor = null, mc = Infinity;
  var perms = PERMS[k] || permutaciones(k);
  for(var q = 0; q < perms.length; q++){
    var perm = perms[q], c = 0;
    for(var gi = 0; gi < k; gi++){
      var ci = perm[gi], g = groups[gi];
      var ids = [g.a[0], g.a[1], g.b[0], g.b[1]];
      for(var j = 0; j < 4; j++){
        var h = cc[ids[j]];
        c += (h && h[ci]) || 0;
      }
    }
    if(c < mc){ mc = c; mejor = perm; }
  }
  return { coste:mc, perm:mejor };
}

/* Primero manda la calidad de las parejas; el reparto de canchas solo
   desempata entre sorteos igual de buenos, así que nunca la empeora. */
function arrangeRandom(playing, pc, oc, cc){
  var best = null, bestCost = Infinity, bestCancha = Infinity;
  var trials = playing.length > 8 ? 3000 : 1500;
  for(var t=0;t<trials;t++){
    var arr = shuffle(playing.slice());
    var cost = 0, groups = [];
    for(var i=0;i<arr.length;i+=4){
      var r = bestSplit(arr.slice(i, i + 4), pc, oc);
      cost += r.cost;
      groups.push({ a:r.a, b:r.b });
    }
    if(cost > bestCost) continue;
    var rp = mejorReparto(groups, cc);
    if(cost < bestCost || rp.coste < bestCancha){
      bestCost = cost; bestCancha = rp.coste;
      if(rp.perm){
        var out = [];
        for(var gi = 0; gi < groups.length; gi++) out[rp.perm[gi]] = groups[gi];
        best = out;
      }else best = groups;
    }
  }
  return best;
}

/* Reparto de canchas, ya con el cuadro cerrado.
   Cambiar de cancha a un grupo entero no altera con quién ni contra quién
   juega nadie, así que esto se puede optimizar aparte sin tocar las parejas.
   Vamos ronda por ronda probando las permutaciones y quedándonos con la que
   deja los recuentos por jugador más igualados; repetimos hasta que no mejore. */
function equilibrarCanchas(rounds){
  var k = 0;
  rounds.forEach(function(r){ k = Math.max(k, r.matches.length); });
  if(k < 2) return rounds;
  var perms = PERMS[k] || permutaciones(k);
  var cc = {};

  function contar(r, signo){
    r.matches.forEach(function(m, ci){
      var ids = [m.a[0], m.a[1], m.b[0], m.b[1]];
      for(var j = 0; j < 4; j++){
        var id = ids[j];
        if(!cc[id]) cc[id] = [];
        cc[id][ci] = (cc[id][ci] || 0) + signo;
      }
    });
  }
  /* Suma de cuadrados: con el total de cada jugador fijo, minimizarla
     equivale a repartir sus partidos entre canchas lo más parejo posible. */
  function coste(){
    var t = 0, ids = Object.keys(cc);
    for(var i = 0; i < ids.length; i++){
      var v = cc[ids[i]];
      for(var c = 0; c < k; c++){ var x = v[c] || 0; t += x * x; }
    }
    return t;
  }
  function permutar(m, perm){
    var out = [];
    for(var gi = 0; gi < m.length; gi++) out[perm[gi]] = m[gi];
    return out;
  }

  rounds.forEach(function(r){ contar(r, 1); });

  for(var pase = 0; pase < 8; pase++){
    var mejoro = false;
    for(var ri = 0; ri < rounds.length; ri++){
      var r = rounds[ri];
      if(r.matches.length < 2) continue;
      var original = r.matches;
      contar(r, -1);
      var mejorM = null, mejorC = Infinity;
      for(var q = 0; q < perms.length; q++){
        if(perms[q].length !== original.length) continue;
        r.matches = permutar(original, perms[q]);
        contar(r, 1);
        var c = coste();
        contar(r, -1);
        if(c < mejorC){ mejorC = c; mejorM = r.matches; }
      }
      r.matches = mejorM || original;
      contar(r, 1);
      for(var z = 0; z < original.length; z++){
        if(r.matches[z] !== original[z]){ mejoro = true; break; }
      }
    }
    if(!mejoro) break;
  }
  return rounds;
}
/* Todas las formas de agrupar una lista de dos en dos. Con 4 parejas salen
   3 combinaciones y con 6 salen 15: se pueden probar todas. */
function agruparDeDos(lista){
  if(lista.length < 2) return [[]];
  var out = [], a = lista[0];
  for(var i = 1; i < lista.length; i++){
    var resto = lista.slice(1, i).concat(lista.slice(i + 1));
    agruparDeDos(resto).forEach(function(r){ out.push([[a, lista[i]]].concat(r)); });
  }
  return out;
}

/* Mexicano: se ordena por la tabla y se empareja al primero con el último,
   al segundo con el penúltimo, y así. Cada pareja suma lo mismo, de modo que
   todos los partidos quedan igualados por nivel. Como la tabla cambia cada
   ronda, las parejas van saliendo distintas solas. */
function arrangeMexicano(playing, pc, oc, cc){
  var rank = ranking().filter(function(r){ return playing.indexOf(r.p.id) >= 0; })
                      .map(function(r){ return r.p.id; });

  var parejas = [];
  for(var i = 0, j = rank.length - 1; i < j; i++, j--) parejas.push([rank[i], rank[j]]);

  // Las parejas están fijadas por la tabla; lo que se elige es quién juega
  // contra quién, evitando repetir rivales y repartiendo las canchas.
  var mejor = null, mc = Infinity;
  agruparDeDos(parejas).forEach(function(comb){
    var groups = comb.map(function(par){ return { a:par[0], b:par[1] }; });
    var c = 0;
    groups.forEach(function(g){
      for(var x = 0; x < 2; x++) for(var y = 0; y < 2; y++){
        var o = oc[key2(g.a[x], g.b[y])] || 0;
        c += 14 * o * o;
      }
    });
    var rp = mejorReparto(groups, cc);
    c += rp.coste;
    if(c < mc){
      mc = c;
      if(rp.perm){
        var out = [];
        for(var gi = 0; gi < groups.length; gi++) out[rp.perm[gi]] = groups[gi];
        mejor = out;
      }else mejor = groups;
    }
  });
  return mejor;
}
function buildRound(){
  var act = actives();
  var courts = syncCourts();
  var playCount = courts * 4;
  var st = stats();

  // En qué ronda descansó cada uno por última vez.
  var ultimo = {};
  S.rounds.forEach(function(r, ri){
    r.rest.forEach(function(id){ ultimo[id] = ri; });
  });
  var ahora = S.rounds.length;
  function sinDescansar(id){
    return ultimo[id] === undefined ? 999 : ahora - ultimo[id];
  }

  /* Descansa quien menos ha descansado —eso mantiene los totales iguales— y,
     a igualdad, quien lleva más rondas sin parar. Antes el desempate era por
     partidos jugados, pero al sortear el cuadro todavía no hay marcadores:
     valía 0 para todos y el orden lo acababa decidiendo el azar, de ahí que
     alguien pudiera descansar dos rondas seguidas.

     Por nivel se añade un criterio más: entre los que llevan los mismos
     descansos y no pararon la ronda pasada, descansa antes quien va ganando.
     Así el que va arriba juega menos y la cosa se empareja. */
  /* Cuánto penaliza haber descansado hace poco: 2 si fue la ronda pasada,
     1 si fue hace dos. Así se mantiene el hueco de dos rondas jugando antes
     de mirar quién va ganando. */
  var recien = function(id){
    if(ultimo[id] === undefined) return 0;
    var d = ahora - ultimo[id];
    return d <= 2 ? (3 - d) : 0;
  };
  var pool = shuffle(act.slice());
  if(S.format === "mexicano" && S.rounds.length > 0){
    pool.sort(function(x,y){
      return (st[x.id].rest - st[y.id].rest) ||
             (recien(x.id) - recien(y.id)) ||
             (st[y.id].pts - st[x.id].pts) ||
             (sinDescansar(y.id) - sinDescansar(x.id));
    });
  }else{
    pool.sort(function(x,y){
      return (st[x.id].rest - st[y.id].rest) || (sinDescansar(y.id) - sinDescansar(x.id));
    });
  }
  var resting = pool.slice(0, act.length - playCount).map(function(p){ return p.id; });
  var playing = pool.slice(act.length - playCount).map(function(p){ return p.id; });

  var h = history();
  // En mexicano la cancha 1 es la de los que van ganando: ahí no se reparte.
  var groups;
  if(S.format === "mexicano" && S.rounds.length > 0){
    groups = arrangeMexicano(playing, h.pc, h.oc, courtHistory());
  }else{
    groups = arrangeRandom(playing, h.pc, h.oc, courtHistory());
  }

  return { rest:resting, matches:groups.map(function(g){ return { a:g.a, b:g.b, sa:null, sb:null }; }) };
}
/* La última ronda no lanza nada: solo dice qué falta para cerrar el torneo. */
function lastBtnLabel(){
  var r = S.rounds[S.cur];
  if(!roundDone(r)) return "Completa los marcadores";
  var faltan = S.rounds.filter(function(x){ return !roundDone(x); }).length;
  if(faltan) return "Faltan " + faltan + (faltan === 1 ? " ronda por anotar" : " rondas por anotar");
  return "Última ronda";
}
function roundDone(r){
  if(!r || !r.matches.length) return false;
  return r.matches.every(function(m){ return m.sa !== null && m.sb !== null; });
}
function plannedTotal(){ return S.format === "americano" ? estRounds() : 1; }
/* Máximo de compañeros distintos que puede tener alguien: o todos los demás,
   o tantos como rondas juegue. Lo que sea menor. */
function idealMates(){
  var n = actives().length, rounds = estRounds();
  return Math.min(n - 1, rounds - (restPerRound() * rounds / n));
}
function drawQuality(rounds){
  var mates = {}, pc = {}, maxRep = 0;
  S.players.forEach(function(p){ mates[p.id] = {}; });
  rounds.forEach(function(r){
    r.matches.forEach(function(m){
      [m.a, m.b].forEach(function(t){
        var k = key2(t[0], t[1]);
        pc[k] = (pc[k] || 0) + 1;
        if(pc[k] > maxRep) maxRep = pc[k];
        if(mates[t[0]]) mates[t[0]][t[1]] = 1;
        if(mates[t[1]]) mates[t[1]][t[0]] = 1;
      });
    });
  });
  var min = Infinity;
  actives().forEach(function(p){ min = Math.min(min, Object.keys(mates[p.id]).length); });

  // Desequilibrio de canchas: cuánto se aleja cada uno del reparto ideal.
  var canchas = 1;
  rounds.forEach(function(r){ canchas = Math.max(canchas, r.matches.length); });
  var cc = {}, desv = 0;
  rounds.forEach(function(r){
    r.matches.forEach(function(m, ci){
      m.a.concat(m.b).forEach(function(id){
        if(!cc[id]) cc[id] = [];
        cc[id][ci] = (cc[id][ci] || 0) + 1;
      });
    });
  });
  Object.keys(cc).forEach(function(id){
    var v = [];
    for(var c = 0; c < canchas; c++) v.push(cc[id][c] || 0);
    var sp = Math.max.apply(null, v) - Math.min.apply(null, v);
    desv += sp * sp;          // al cuadrado: un caso muy desigual pesa más que varios leves
  });

  return { min: min === Infinity ? 0 : min, maxRep: maxRep, desv: desv };
}

/* Sortea el cuadro entero. Cada ronda ve las anteriores, por eso van rotando.
   Repetimos el sorteo completo unas cuantas veces y nos quedamos con el que
   más compañeros distintos le da al jugador peor servido. */
function drawAll(){
  S.rounds = [];
  S.cur = 0;
  if(actives().length < 4) return;
  syncCourts();
  var total = plannedTotal();
  var ideal = idealMates();
  var attempts = actives().length >= 12 ? 3 : 6;
  var best = null, bestMin = -1, bestRep = Infinity, bestDesv = Infinity;

  for(var k = 0; k < attempts; k++){
    S.rounds = [];
    for(var i = 0; i < total; i++) S.rounds.push(buildRound());
    if(S.format !== "mexicano") equilibrarCanchas(S.rounds);
    var q = drawQuality(S.rounds);
    var mejor = q.min > bestMin ||
      (q.min === bestMin && q.maxRep < bestRep) ||
      (q.min === bestMin && q.maxRep === bestRep && q.desv < bestDesv);
    if(mejor){ best = S.rounds; bestMin = q.min; bestRep = q.maxRep; bestDesv = q.desv; }
  }
  S.rounds = best;
  S.cur = 0;
}

/* ============ acciones ============ */
function addPlayer(name){
  name = String(name || "").trim().replace(/\s+/g, " ");
  if(!name) return false;
  if(playerNamed(name)) return false;
  if(S.players.length >= 12){ toast("Máximo 12 jugadores"); return false; }
  S.players.push({ id:uid(), name:name.slice(0,18), active:true });
  rosterAdd(name);
  return true;
}
/* Toca una ficha: entra o sale del torneo. Si ya jugó, se saca con el interruptor. */
function toggleFromRoster(nm){
  var p = playerNamed(nm);
  if(!p){ if(addPlayer(nm)) afterSetupChange(); return; }
  if(stats()[p.id].pj > 0){ toast(nm + " ya jugó; sácalo con el interruptor"); return; }
  S.players = S.players.filter(function(x){ return x.id !== p.id; });
  afterSetupChange();
}
function addAllFromRoster(){
  DB.roster.forEach(function(nm){ if(S.players.length < 12) addPlayer(nm); });
  afterSetupChange();
}
function clearPicked(){
  var st = stats();
  S.players = S.players.filter(function(p){ return st[p.id].pj > 0; });
  afterSetupChange();
}
function rosterDelete(nm){
  if(playerNamed(nm)){ toast("Está jugando este torneo"); return; }
  DB.roster = DB.roster.filter(function(r){ return !sameName(r, nm); });
  save(); render();
}
function addMany(text){
  var n = 0;
  String(text).split(/[,\n;]+/).forEach(function(p){ if(addPlayer(p)) n++; });
  return n;
}
function startTournament(){
  if(actives().length < 4){ toast("Necesitas al menos 4 jugadores"); return; }
  if(!S.rounds.length) drawAll();
  S.started = true;
  S.finished = false;
  S.cur = 0;
  if(DB.tournaments.indexOf(S) < 0){    // era un borrador: ahora sí se guarda
    DB.tournaments.push(S);
    DB.active = DB.tournaments.length - 1;
    DB.seq++;
  }
  tab = "ronda";                       // se empieza jugando, no mirando el cuadro
  save(); render();
  // La clave se genera al arrancar: no hay que acordarse de publicar nada.
  if(BACKEND === true && !S.remote) publish();
}
/* Borrador: vive solo en memoria. Si te vas al inicio sin empezar, se
   descarta y la lista de torneos no se ensucia. */
function newTournament(){
  enHome = false;
  S = freshT(DB.seq);
  tab = "ronda";
  render();
  window.scrollTo({ top:0, behavior:"smooth" });
}
function deleteTournament(i){
  var t = DB.tournaments[i];
  if(!t) return;
  var jugado = t.rounds.some(roundDoneAny);
  ask({
    title: "¿Eliminar «" + t.name + "»?",
    body: jugado
      ? "Se borran sus " + t.rounds.length + " rondas y su tabla de puntos. No se puede deshacer."
      : "Todavía no tiene resultados anotados.",
    ok: "Eliminar",
    danger: true,
    onOk: function(){
      DB.tournaments.splice(i, 1);
      if(!DB.tournaments.length) enHome = true;
      openT(DB.active > i ? DB.active - 1 : DB.active);
      save(); render();
      toast("Torneo eliminado");
    }
  });
}
/* Solo en mexicano: la ronda siguiente depende de cómo quedó la tabla, así
   que se sortea al cerrar la anterior en vez de tenerlo todo hecho. */
function nextRound(){
  if(S.rounds.length >= estRounds()){ toast("Ya se jugaron las rondas previstas"); return; }
  S.rounds.push(buildRound());
  S.cur = S.rounds.length - 1;
  tab = "ronda";
  save(); render();
  window.scrollTo({ top:0, behavior:"smooth" });
}
function roundDoneAny(r){ return r.matches.some(function(m){ return m.sa !== null || m.sb !== null; }); }

/* El torneo se cierra solo al completar la última ronda prevista. */
/* Están jugadas todas las rondas previstas y anotadas todas. No cierra el
   torneo por su cuenta: para eso hay un botón, porque cerrarlo mientras
   todavía estás tecleando el último marcador es una faena. */
function torneoCompleto(){
  return S.rounds.length >= estRounds() && S.rounds.length > 0 && S.rounds.every(roundDone);
}

function redrawAll(){
  var go = function(){ drawAll(); S.finished = false; save(); render(); };
  if(S.rounds.some(roundDoneAny)){
    ask({ title:"Rehacer el cuadro entero", body:"Hay resultados anotados y se van a borrar.",
          ok:"Rehacer", danger:true, onOk:go });
  }else go();
}
/* Se escriben a mano, pero la ronda reparte S.roundPoints puntos:
   al poner uno, el otro se completa para que la suma siempre cuadre. */
function setScore(mi, side, raw){
  var r = S.rounds[S.cur]; if(!r) return;
  var m = r.matches[mi]; if(!m) return;
  var v;
  if(raw === "" || raw === null){ v = null; }
  else{
    v = parseInt(String(raw).replace(/[^0-9]/g, ""), 10);
    v = isNaN(v) ? null : Math.max(0, Math.min(S.roundPoints, v));
  }
  if(side === "a"){
    m.sa = v; m.sb = (v === null) ? null : S.roundPoints - v;
  }else{
    m.sb = v; m.sa = (v === null) ? null : S.roundPoints - v;
  }
  save();
}
function bump(mi, side, d){
  var m = S.rounds[S.cur].matches[mi];
  var cur = (side === "a" ? m.sa : m.sb);
  if(cur === null) cur = 0;
  setScore(mi, side, Math.max(0, Math.min(S.roundPoints, cur + d)));
  render();
}
function sumaMal(m){
  return m.sa !== null && m.sb !== null && (m.sa + m.sb) !== S.roundPoints;
}
/* Si el torneo está publicado, todo lo que se manda lleva la clave y el
   enlace al final, para que quien lo reciba pueda seguirlo en vivo. */
function pieEnlace(){

}
function textoTabla(){

    S.rounds.filter(roundDone).length + " de " + S.rounds.length + " rondas"];
  var w = 0;
  rk.forEach(function(r){ w = Math.max(w, r.p.name.length); });
  rk.forEach(function(r, i){
    lines.push(String(i+1).padStart(2," ") + ". " + r.p.name.padEnd(w+1," ") +
      String(r.pts).padStart(4," ") + " pts  (" + r.g + "G " + r.e + "E " + r.l + "P)");
  });
  return lines.join("\n") + pieEnlace();
}
function textoCuadro(){
  var lines = ["🎾 " + S.name + " — cuadro de " + S.rounds.length + " rondas"];
  S.rounds.forEach(function(r, ri){
    lines.push("");
    lines.push("RONDA " + (ri+1));
    r.matches.forEach(function(m, mi){
      var sc = (m.sa !== null && m.sb !== null) ? "  " + m.sa + "-" + m.sb : "";
      lines.push("  C" + (mi+1) + ": " + nameOf(m.a[0]) + " y " + nameOf(m.a[1]) +
                 "  vs  " + nameOf(m.b[0]) + " y " + nameOf(m.b[1]) + sc);
    });
    if(r.rest.length) lines.push("  Descansa" + (r.rest.length===1?": ":"n: ") +
      r.rest.map(nameOf).join(", "));
  });
  return lines.join("\n") + pieEnlace();
}

function copy(txt, ok){

/* Diálogo propio: los artifacts corren en un iframe donde confirm() del navegador
   está bloqueado y devuelve siempre "no", así que nada se llegaba a borrar. */
var pendingAsk = null;
function ask(o){
  pendingAsk = o.onOk;
  document.getElementById("mTitle").textContent = o.title;
  document.getElementById("mBody").textContent = o.body || "";
  var okB = document.getElementById("mOk");
  okB.textContent = o.ok || "Aceptar";

}
function closeAsk(run){

}

var toastT = null;
function toast(msg){
