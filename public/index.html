  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove("on"); }, 1900);
}

/* ============================================================
   Hoja del torneo para mandar al grupo.
   Se describe una vez (páginas de A4 en puntos, origen abajo-izquierda)
   y se pinta en PDF o, si el navegador no deja guardar PDF, en PNG.
   ============================================================ */
var PG_W = 595, PG_H = 842, PG_M = 46;

function hojaSpec(){
  var paginas = [], pag = null, y = 0;
  var der = PG_W - PG_M;

  function nueva(){ pag = { ops: [] }; paginas.push(pag); y = PG_H - PG_M; }
  function tyx(t, x, yy, size, bold, gris){
    pag.ops.push({ k:"t", t:String(t), x:x, y:yy, s:size, b:!!bold, g:gris || 0 });
  }
  function txt(t, x, size, bold, gris){ tyx(t, x, y, size, bold, gris); }
  function linea(x1, y1, x2, y2, gris){
    pag.ops.push({ k:"l", x1:x1, y1:y1, x2:x2, y2:y2, g:gris });
  }
  function regla(){ linea(PG_M, y, der, y); }
  function baja(n){ y -= n; }
  function corta(t, max){
    t = String(t);
    return t.length > max ? t.slice(0, max - 1) + "…" : t;
  }

  // ── geometría de la cuadrícula ──
  var canchas = 1;
  S.rounds.forEach(function(r){ canchas = Math.max(canchas, r.matches.length); });
  var hayDesc = S.rounds.some(function(r){ return r.rest.length; });
  var wR = 34, wD = hayDesc ? 78 : 0;
  var x0 = PG_M + wR;
  var wC = (der - wD - x0) / canchas;
  var maxCh = Math.floor((wC - 26) / 4.3);
  var ALTO = 29;

  function cabeceraTabla(){
    txt("RONDA", PG_M, 6.5, false, 0.55);
    for(var c = 0; c < canchas; c++) txt("CANCHA " + (c + 1), x0 + c * wC + 6, 6.5, false, 0.55);
    if(hayDesc) txt("DESCANSA", der - wD + 5, 6.5, false, 0.55);
    baja(5); regla();
  }

  // ── portada ──
  nueva();
  txt("PADELITO", PG_M, 8, false, 0.5); baja(19);
  txt(S.name, PG_M, 21, true); baja(15);
  txt(setupLine(), PG_M, 9.5, false, 0.42); baja(11);
  txt(durLine() + " · " + nombreFormato(), PG_M, 9.5, false, 0.42);
  baja(16);
  cabeceraTabla();

  // ── el cuadro, en cuadrícula ──
  S.rounds.forEach(function(r, ri){
    if(y - ALTO < PG_M + 26){ nueva(); cabeceraTabla(); }
    var top = y;
    tyx(ri + 1, PG_M + 2, top - 19, 15, true, 0.4);

    r.matches.forEach(function(m, mi){
      var cx = x0 + mi * wC, hay = m.sa !== null && m.sb !== null;
      tyx(corta(nameOf(m.a[0]) + " · " + nameOf(m.a[1]), maxCh), cx + 6, top - 11, 8.5, hay && m.sa > m.sb);
      tyx(corta(nameOf(m.b[0]) + " · " + nameOf(m.b[1]), maxCh), cx + 6, top - 22, 8.5, hay && m.sb > m.sa);
      tyx(hay ? m.sa : "·", cx + wC - 13, top - 11, 10, hay, hay ? 0 : 0.62);
      tyx(hay ? m.sb : "·", cx + wC - 13, top - 22, 10, hay, hay ? 0 : 0.62);
    });

    if(hayDesc && r.rest.length){
      tyx(corta(r.rest.map(nameOf).join(", "), 15), der - wD + 5, top - 17, 7.5, false, 0.5);
    }

    linea(x0, top, x0, top - ALTO, 0.9);
    for(var c = 1; c < canchas; c++) linea(x0 + c * wC, top, x0 + c * wC, top - ALTO, 0.9);
    if(hayDesc) linea(der - wD, top, der - wD, top - ALTO, 0.9);

    baja(ALTO); regla();
  });

  // ── reparto por jugador ──
  var st = stats(), total = S.rounds.length;
  var reparto = S.players.map(function(p){
    return { n:p.name, d:st[p.id].rest, j:total - st[p.id].rest };
  }).sort(function(a, b){ return b.j - a.j || a.n.localeCompare(b.n, "es"); });
  var maxJ = Math.max.apply(null, reparto.map(function(r){ return r.j; }));
  var minJ = Math.min.apply(null, reparto.map(function(r){ return r.j; }));

  function sitio(n){ if(y - n < PG_M + 26) nueva(); }
  sitio(46 + Math.min(reparto.length, 5) * 12);
  baja(20);
  txt("REPARTO POR JUGADOR", PG_M, 11, true);
  txt(maxJ === minJ ? "todos igual" : "de " + minJ + " a " + maxJ + " partidos", der - 96, 8, false, 0.5);
  baja(6); regla(); baja(12);
  txt("JUGADOR", PG_M, 6.5, false, 0.55);
  txt("PARTIDOS", 300, 6.5, false, 0.55);
  txt("DESCANSOS", 396, 6.5, false, 0.55);
  baja(12);
  reparto.forEach(function(r){
    sitio(12);
    txt(corta(r.n, 24), PG_M, 10);
    txt(r.j, 300, 10, maxJ !== minJ && r.j === maxJ);
    txt(r.d, 396, 10, maxJ !== minJ && r.j === minJ);
    baja(12);
  });

  function pie(){
    paginas.forEach(function(p, i){
      p.ops.push({ k:"t", t:"Padelito", x:PG_M, y:30, s:7.5, b:false, g:0.6 });
      p.ops.push({ k:"t", t:(i + 1) + " / " + paginas.length, x:der - 24, y:30, s:7.5, b:false, g:0.6 });
    });
    return paginas;
  }

  // ── tabla, solo si ya hay algo anotado ──
  if(!S.rounds.some(roundDoneAny)) return pie();

  var rk = ranking();
  sitio(46 + Math.min(rk.length, 5) * 13);
  baja(20);
  txt("TABLA", PG_M, 11, true);
  baja(6); regla(); baja(12);
  var cols = ["#", "JUGADOR", "PTS", "G", "E", "P"];
  var cx = [PG_M, PG_M + 20, 300, 356, 396, 436];
  if(S.scoring === "partidos"){ cols.push("JUEGO"); cx.push(478); }
  cols.forEach(function(h, i){ txt(h, cx[i], 6.5, false, 0.55); });
  baja(13);
  rk.forEach(function(f, i){
    sitio(13);
    txt(i + 1, PG_M, 9.5, false, 0.5);
    txt(corta(f.p.name, 22), PG_M + 20, 10.5, i === 0);
    txt(f.pts, 300, 10.5, i === 0);
    txt(f.g, 356, 10, true);
    txt(f.e, 396, 9.5, false, 0.4);
    txt(f.l, 436, 9.5, false, 0.4);
    if(S.scoring === "partidos") txt(f.juego, 478, 9.5, false, 0.4);
    baja(13);
  });
  return pie();
}

/* --- PDF --- */
var WINANSI = { "–":0x96, "—":0x97, "‘":0x91, "’":0x92,
                "“":0x93, "”":0x94, "•":0x95, "…":0x85, "€":0x80 };
function pdfTexto(s){
  var out = "";
  for(var i = 0; i < s.length; i++){
    var ch = s[i], b = WINANSI[ch];
    if(b === undefined) b = s.charCodeAt(i) < 256 ? s.charCodeAt(i) : 63;
    var c = String.fromCharCode(b);
    out += (c === "(" || c === ")" || c === "\\") ? "\\" + c : c;
  }
  return out;
}
function num(n){ return (Math.round(n * 100) / 100); }

function aPDF(paginas){
  var flujos = paginas.map(function(pg){
    var s = "";
    pg.ops.forEach(function(o){
      if(o.k === "t"){
        var g = num(o.g);
        s += g + " " + g + " " + g + " rg\n";
        s += "BT /" + (o.b ? "F1" : "F2") + " " + o.s + " Tf " +
             num(o.x) + " " + num(o.y) + " Td (" + pdfTexto(o.t) + ") Tj ET\n";
      }else{
        var lg = num(o.g === undefined ? 0.84 : o.g);
        s += lg + " " + lg + " " + lg + " RG 0.7 w " + num(o.x1) + " " + num(o.y1) + " m " +
             num(o.x2) + " " + num(o.y2) + " l S\n";
      }
    });
    return s;
  });

  var P = paginas.length;
  var nF1 = 3 + 2 * P, nF2 = nF1 + 1;
  var objs = [];
  objs[1] = "<</Type/Catalog/Pages 2 0 R>>";
  objs[2] = "<</Type/Pages/Count " + P + "/Kids[" +
    paginas.map(function(_, i){ return (3 + 2 * i) + " 0 R"; }).join(" ") + "]>>";
  paginas.forEach(function(_, i){
    objs[3 + 2 * i] = "<</Type/Page/Parent 2 0 R/MediaBox[0 0 " + PG_W + " " + PG_H +
      "]/Resources<</Font<</F1 " + nF1 + " 0 R/F2 " + nF2 + " 0 R>>>>/Contents " + (4 + 2 * i) + " 0 R>>";
    objs[4 + 2 * i] = "<</Length " + flujos[i].length + ">>\nstream\n" + flujos[i] + "endstream";
  });
  objs[nF1] = "<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>";
  objs[nF2] = "<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>";

  var out = "%PDF-1.4\n", pos = [];
  for(var i = 1; i < objs.length; i++){
    pos[i] = out.length;
    out += i + " 0 obj\n" + objs[i] + "\nendobj\n";
  }
  var xref = out.length;
  out += "xref\n0 " + objs.length + "\n0000000000 65535 f \n";
  for(var j = 1; j < objs.length; j++){
    out += ("0000000000" + pos[j]).slice(-10) + " 00000 n \n";
  }
  out += "trailer\n<</Size " + objs.length + "/Root 1 0 R>>\nstartxref\n" + xref + "\n%%EOF";

  var bytes = new Uint8Array(out.length);
  for(var k = 0; k < out.length; k++) bytes[k] = out.charCodeAt(k) & 0xFF;
  return bytes;
}

/* --- PNG, para cuando el navegador no deja guardar PDF --- */
function aPNG(paginas){
  return new Promise(function(res, rej){
    var esc = 2, hueco = 18;
    var alto = PG_H * paginas.length + hueco * (paginas.length - 1);
    var c = document.createElement("canvas");
    c.width = PG_W * esc; c.height = alto * esc;
    var g = c.getContext("2d");
    if(!g) return rej(new Error("sin canvas"));
    g.scale(esc, esc);
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, PG_W, alto);
    g.textBaseline = "alphabetic";
    paginas.forEach(function(pg, i){
      var off = i * (PG_H + hueco);
      pg.ops.forEach(function(o){
        if(o.k === "t"){
          var v = Math.round((o.g || 0) * 255);
          g.fillStyle = o.g ? "rgb(" + v + "," + v + "," + v + ")" : "#101010";
          g.font = (o.b ? "bold " : "") + o.s + "px Helvetica, Arial, sans-serif";
          g.fillText(o.t, o.x, off + (PG_H - o.y));
        }else{
          var lv = Math.round((o.g === undefined ? 0.855 : o.g) * 255);
          g.strokeStyle = "rgb("+lv+","+lv+","+lv+")"; g.lineWidth = 0.7;
          g.beginPath();
          g.moveTo(o.x1, off + (PG_H - o.y1));
          g.lineTo(o.x2, off + (PG_H - o.y2));
          g.stroke();
        }
      });
    });
    c.toBlob(function(b){ b ? res(b) : rej(new Error("sin blob")); }, "image/png");
  });
}

/* Tabla final como imagen, para mandarla al grupo y que se vea en el chat
   sin abrir nada. Se dibuja con la paleta clara para que se lea bien tanto
   en WhatsApp claro como oscuro. */
function tablaPNG(){
  return new Promise(function(res, rej){
    var rk = ranking(), parts = S.scoring === "partidos";
    var W = 820, FILA = 62, TOP = 168, PIE = 58;
    var H = TOP + rk.length * FILA + PIE;
    var esc2 = 2;

    var c = document.createElement("canvas");
    c.width = W * esc2; c.height = H * esc2;
    var g = c.getContext("2d");
    if(!g) return rej(new Error("sin canvas"));
    g.scale(esc2, esc2);

    var TIPO = "'Avenir Next Condensed','Roboto Condensed','Arial Narrow',Helvetica,Arial,sans-serif";
    var MONO = "'SF Mono',Menlo,Consolas,monospace";
    var ORO = ["#F6EBCB", "#7E590C"], PLATA = ["#E7EDF1", "#5C6A75"], BRONCE = ["#F4DFCE", "#8A5024"];

    function texto(t, x, y, size, bold, color, alin){
      g.fillStyle = color;
      g.font = (bold ? "700 " : "400 ") + size + "px " + TIPO;
      g.textAlign = alin || "left";
      g.fillText(String(t), x, y);
    }
    function redondo(x, y, w, h, r){
      g.beginPath();
      g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
      g.arcTo(x, y, x + w, y, r); g.closePath();
    }

    g.fillStyle = "#EAF1F5"; g.fillRect(0, 0, W, H);
    redondo(16, 16, W - 32, H - 32, 22); g.fillStyle = "#FFFFFF"; g.fill();

    // cabecera
    texto("PADELITO", 46, 58, 15, false, "#8FA6B3");
    texto(S.name, 46, 96, 34, true, "#0B1F2C");
    var sub = (S.finished ? "Torneo concluido · " : "Van ") + S.rounds.length + " rondas · " +
      S.players.length + " jugadores" + (parts ? " · 3-1-0" : "");
    texto(sub, 46, 122, 15, false, "#5E7A8A");
    if(S.remote) texto("Clave " + S.remote.slug, W - 46, 96, 20, true, "#0F4C75", "right");

    g.strokeStyle = "#D2E0E8"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(46, TOP - 26); g.lineTo(W - 46, TOP - 26); g.stroke();

    var xN = 108, xP = 520, xG = 606, xE = 672, xL = 738;
    g.font = "400 12px " + MONO; g.fillStyle = "#8FA6B3"; g.textAlign = "left";
    g.fillText("JUGADOR", xN, TOP - 8);
    g.textAlign = "right";
    ["PTS", "G", "E", "P"].forEach(function(h, i){
      g.fillText(h, [xP, xG, xE, xL][i], TOP - 8);
    });

    rk.forEach(function(f, i){
      var y = TOP + i * FILA, medalla = i < 3 && f.pj > 0;
      var col = i === 0 ? ORO : i === 1 ? PLATA : BRONCE;
      if(medalla){
        redondo(34, y + 5, W - 68, FILA - 10, 12);
        g.fillStyle = col[0]; g.fill();
      }else if(i % 2){
        g.fillStyle = "#F6FAFC"; g.fillRect(34, y + 5, W - 68, FILA - 10);
      }
      // puesto
      if(medalla){
        g.beginPath(); g.arc(66, y + FILA / 2, 17, 0, 6.284);
        g.fillStyle = col[1]; g.fill();
        texto(i + 1, 66, y + FILA / 2 + 7, 18, true, "#FFFFFF", "center");
      }else{
        texto(i + 1, 66, y + FILA / 2 + 7, 19, true, "#8FA6B3", "center");
      }
      texto(f.p.name, xN, y + FILA / 2 + 8, 25, i < 3, "#0B1F2C");
      texto(f.pts, xP, y + FILA / 2 + 8, 26, true, "#0B1F2C", "right");
      texto(f.g,  xG, y + FILA / 2 + 7, 20, true, "#12805A", "right");
      texto(f.e,  xE, y + FILA / 2 + 7, 19, false, "#5E7A8A", "right");
      texto(f.l,  xL, y + FILA / 2 + 7, 19, false, "#5E7A8A", "right");
    });

    var yPie = TOP + rk.length * FILA + 22;
    texto(parts ? "Pts: 3 por ganar, 1 por empatar · G ganados · E empatados · P perdidos"
                : "Pts: puntos ganados · G ganados · E empatados · P perdidos",
          46, yPie, 13, false, "#8FA6B3");

    c.toBlob(function(b){ b ? res(b) : rej(new Error("sin blob")); }, "image/png");
  });
}

function compartirTabla(){
  tablaPNG().then(function(png){
    var nombre = nombreHoja() + "-tabla.png";
    var file = null;
    try{ file = new File([png], nombre, { type:"image/png" }); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:S.name, text: mensajeResultados() })
        .catch(function(err){ if(!err || err.name !== "AbortError") descargar(png, nombre); });
      return;
    }
    if(window.claude && window.claude.use){
      window.claude.use("downloads").then(function(dl){
        if(!dl){ toast("Aquí no se puede guardar"); return; }
        return dl.save({ filename:nombre, data:png }).then(function(){ toast("Imagen guardada"); });
      }).catch(function(e){ if(!e || e.code !== "declined") toast("No se pudo guardar"); });
      return;
    }
    descargar(png, nombre);
  }).catch(function(){ toast("No se pudo crear la imagen"); });
}

function nombreHoja(){
  return "padel-" + String(S.name).replace(/[^\wáéíóúñÁÉÍÓÚÑ -]/g, "-").replace(/\s+/g, "-").toLowerCase();
}

/* Compartir: hoja nativa de iOS (ahí sale WhatsApp) → descarga → imagen. */
function compartirHoja(){
  var paginas;
  try{ paginas = hojaSpec(); }
  catch(e){ toast("No se pudo generar la hoja"); return; }

  var enArtifact = !!(window.claude && typeof window.claude.use === "function");
  var pdf = new Blob([aPDF(paginas)], { type: "application/pdf" });
  var nombre = nombreHoja();

  if(!enArtifact){
    var file = null;
    try{ file = new File([pdf], nombre + ".pdf", { type: "application/pdf" }); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: S.name,
                        text: S.remote ? mensajeGrupo() : S.name })
        .catch(function(err){ if(!err || err.name !== "AbortError") descargar(pdf, nombre + ".pdf"); });
      return;
    }
    descargar(pdf, nombre + ".pdf");
    return;
  }
  guardarPNG(paginas, nombre);
}
function descargar(blob, nombre){
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
    toast("Hoja descargada");
  }catch(e){ toast("No se pudo descargar"); }
}
function guardarPNG(paginas, nombre){
  if(!window.claude || !window.claude.use){ toast("Aquí no se puede guardar"); return; }
  window.claude.use("downloads").then(function(dl){
    if(!dl){ toast("Aquí no se puede guardar; usa Copiar cuadro"); return; }
    return aPNG(paginas).then(function(png){
      return dl.save({ filename: nombre + ".png", data: png });
    }).then(function(){ toast("Imagen guardada, ya puedes mandarla"); });
  }).catch(function(e){

/* Una ronda del cuadro. interactive = botón para ir a anotar y resalte de la ronda actual. */
function roundCard(r, ri, interactive){
  /* Apilado en vez de enfrentado: ocupa la mitad de ancho y así caben dos
     rondas por fila, que es la mitad de scroll. */
  var fx = r.matches.map(function(m, mi){
    var has = m.sa !== null && m.sb !== null;
    function linea(ids, val, gana){
      return '<div class="fxl'+(gana?" w":"")+'">' +
        '<span class="fxn">'+esc(nameOf(ids[0]))+' <i>·</i> '+esc(nameOf(ids[1]))+'</span>' +
        '<span class="fxp'+(has?"":" pend")+'">'+(has ? val : "·")+'</span>' +
      '</div>';
    }
    return '<div class="fx">' +
      '<span class="fx-c">C'+(mi+1)+'</span>' +
      '<div class="fxg">' +
        linea(m.a, m.sa, has && m.sa > m.sb) +
        linea(m.b, m.sb, has && m.sb > m.sa) +
      '</div>' +
    '</div>';
  }).join("");
  var rest = r.rest.length
    ? '<div class="fx-rest">Descansa'+(r.rest.length===1?" ":"n ")+
        r.rest.map(function(id){ return esc(nameOf(id)); }).join(" · ")+'</div>'
    : "";
  return '<div class="card'+(interactive && ri===S.cur?" now":"")+'">' +
    '<div class="court-head">' +
      '<span class="n">Ronda '+(ri+1)+'</span>' +
      (interactive
        ? '<span class="t">'+(roundDone(r)?"completa":"pendiente")+'</span>' +
          (RO ? '' : '<button class="btn btn-sm btn-ghost" data-act="goto" data-r="'+ri+'" style="padding:3px 10px">Anotar</button>')
        : '') +
    '</div>' + fx + rest +
  '</div>';
}
/* Lo que le toca a cada uno en este cuadro: cuántos partidos juega y
   cuántas veces descansa. Si no sale parejo, se señala a quién le toca peor. */
function repartoHTML(){
  if(!S.rounds.length) return "";
  var st = stats(), total = S.rounds.length;
  var datos = S.players.map(function(p){
    return { p:p, desc:st[p.id].rest, juega:total - st[p.id].rest };
  }).sort(function(a,b){ return b.juega - a.juega || a.p.name.localeCompare(b.p.name, "es"); });

  var maxJ = Math.max.apply(null, datos.map(function(d){ return d.juega; }));
  var minJ = Math.min.apply(null, datos.map(function(d){ return d.juega; }));
  var parejo = maxJ === minJ;

  var filas = datos.map(function(d){
    var marca = parejo ? "" : d.juega === maxJ ? " mas" : d.juega === minJ ? " menos" : "";
    return '<div class="rep'+marca+'">' +
      '<span class="nm">'+esc(d.p.name)+'</span>' +
      '<span class="n1">'+d.juega+'<i>'+(d.juega===1?" partido":" partidos")+'</i></span>' +
      '<span class="n2">'+d.desc+'<i>'+(d.desc===1?" descanso":" descansos")+'</i></span>' +
    '</div>';
  }).join("");

  // Con cuántos compañeros distintos coincide el peor servido
  var posibles = S.players.length - 1, comp = {};
  S.players.forEach(function(p){ comp[p.id] = {}; });
  S.rounds.forEach(function(r){
    r.matches.forEach(function(m){
      [m.a, m.b].forEach(function(t){
        if(comp[t[0]]) comp[t[0]][t[1]] = 1;
        if(comp[t[1]]) comp[t[1]][t[0]] = 1;
      });
    });
  });
  var minComp = Infinity;
  S.players.forEach(function(p){ minComp = Math.min(minComp, Object.keys(comp[p.id]).length); });

  var notaComp;
  if(minComp >= posibles){
    notaComp = "Además, cada uno juega con los otros " + posibles + ": todos con todos.";
  }else{
    var sug = S.started ? null : rondasTodosConTodos();
    notaComp = "Cada uno coincide con " + minComp + " de los " + posibles + " compañeros posibles.";
    if(sug) notaComp += " Con " + sug + " rondas jugarían todos con todos.";
    else if(!S.started) notaComp += " Con " + actives().length + " jugadores no hay ningún número de rondas que lo consiga.";
  }

  return '<div class="card box">' +
    '<h3>'+(S.started ? "Reparto por jugador" : "Cómo queda el reparto")+
      '<span class="side-note">'+
      (parejo ? "todos igual" : "de "+minJ+" a "+maxJ+" partidos")+'</span></h3>' +
    '<div class="repl">'+filas+'</div>' +
    '<p class="hint">'+(S.format === "mexicano"
      ? "Van " + S.rounds.length + " de " + estRounds() + " rondas. Por nivel el cuadro se forma sobre la marcha, así que estos números crecen ronda a ronda."
      : parejo
        ? "Nadie sale perjudicado: todos juegan lo mismo y descansan lo mismo."
        : "El torneo no quedó parejo. En verde quien más juega, en rojo quien menos.")+'</p>' +
    (S.format === "mexicano" ? '' : '<p class="hint">'+esc(notaComp)+'</p>') +
  '</div>';
}

  var isLast = S.cur === S.rounds.length - 1;

  var courts = r.matches.map(function(m, i){
    var has = m.sa !== null && m.sb !== null;
    function lado(ids, val, win, side){
      var nuevo = side && flash[S.cur + "-" + i + "-" + side];
      return '<div class="side'+(win?" win":"")+'">' +
        '<div class="names">' +
          '<div class="p">'+esc(nameOf(ids[0]))+'</div>' +
          '<div class="p">'+esc(nameOf(ids[1]))+'</div>' +
        '</div>' +
        '<div class="scv'+(nuevo?" just":"")+'">'+(val === null ? "·" : val)+'</div>' +
      '</div>';
    }
    function ladoEdit(side, ids, val, win){
      return '<div class="side'+(win?" win":"")+'">' +
        '<div class="names">' +
          '<div class="p">'+esc(nameOf(ids[0]))+'</div>' +
          '<div class="p">'+esc(nameOf(ids[1]))+'</div>' +
        '</div>' +
        '<div class="scorebox">' +
          '<button class="stp" data-act="bump" data-m="'+i+'" data-s="'+side+'" data-d="-1" aria-label="Quitar un punto">−</button>' +
          '<input class="sc" inputmode="numeric" maxlength="1" data-sc="'+i+"-"+side+'" data-m="'+i+'" data-s="'+side+'"' +
            ' value="'+(val === null ? "" : val)+'" aria-label="Puntos">' +
          '<button class="stp" data-act="bump" data-m="'+i+'" data-s="'+side+'" data-d="1" aria-label="Sumar un punto">+</button>' +
        '</div>' +
      '</div>';
    }
    var etiqueta = sumaMal(m) ? '<span class="t mal">no suma '+S.roundPoints+'</span>'
                              : '<span class="t">'+S.roundPoints+' puntos</span>';

    if(RO){
      return '<div class="court">' +
        '<div class="court-head"><span class="n">Cancha '+(i+1)+'</span>' +
          '<span class="t">'+(has ? "final" : "en juego")+'</span></div>' +
        lado(m.a, m.sa, has && m.sa > m.sb, "a") +
        '<div class="net" aria-hidden="true"></div>' +
        lado(m.b, m.sb, has && m.sb > m.sa, "b") +
      '</div>';
    }
    return '<div class="court">' +
      '<div class="court-head"><span class="n">Cancha '+(i+1)+'</span>' + etiqueta + '</div>' +
      ladoEdit("a", m.a, m.sa, has && m.sa > m.sb) +
      '<div class="net" aria-hidden="true"></div>' +
      ladoEdit("b", m.b, m.sb, has && m.sb > m.sa) +

  var restHTML = r.rest.length

    : "";

    action = '<button class="btn btn-primary btn-wide" data-act="goTabla">Torneo concluido · ver la tabla</button>';
  }else if(isLast && S.format === "mexicano" && S.rounds.length < estRounds()){
    action = '<button class="btn btn-primary btn-wide" data-act="next"'+(done?"":" disabled")+'>' +
      (done ? "Sortear ronda " + (S.rounds.length + 1) + " de " + estRounds()
            : "Completa los marcadores") + '</button>';
  }else if(isLast && torneoCompleto()){

  }else{
    action = '<button class="btn btn-primary btn-wide" data-act="nextR">Ronda '+(S.cur+2)+' →</button>';
  }

    ? '<div class="clave-aviso">' +
        '<div class="clave-aviso-txt">' +
          '<span class="lbl" style="margin:0">Clave del torneo</span>' +

/* La barra de abajo cambia según dónde estés: dentro de un torneo lleva a
   sus pantallas; fuera, sirve para moverse por la app sin perderse. */
function pintarBarra(modo){
  var b = document.getElementById("tabsIn"), h = "";
  function t(act, val, ic, txt, on){
    return '<button class="tab" data-act="'+act+'"'+(val!==null?' data-v="'+val+'"':'')+
      ' aria-selected="'+(!!on)+'"><span class="ic">'+ic+'</span><span>'+txt+'</span></button>';
  }
  if(modo === "home"){
    var v = enHome ? (tab === "ajustes" ? "ajustes" : tab === "torneos" ? "torneos" : "inicio") : "";
    h = t("homeIr", "inicio",  "⌂", "Inicio",  v === "inicio") +
        t("homeIr", "torneos", "▤", "Torneos", v === "torneos") +
        t("irAjustes", null, ICONO_ENG, "Ajustes", v === "ajustes");
  }else{
    h = '<button class="tab tab-inicio" data-act="inicio"><span class="ic">⌂</span><span>Inicio</span></button>' +
        t("verTab", "ronda",  "VS", "Ronda",  tab === "ronda") +
        t("verTab", "cuadro", "▦", "Cuadro", tab === "cuadro") +
        t("verTab", "tabla",  "#",  "Tabla",  tab === "tabla");
  }
  b.innerHTML = h;
  b.style.gridTemplateColumns = "repeat(" + (modo === "home" ? 3 : 4) + ",1fr)";
}

function render(){
  var view   = document.getElementById("view");
  var tabsEl = document.getElementById("tabs");
  document.body.classList.toggle("ro", !!RO);
  view.style.zoom = (DB.escala && DB.escala !== 1) ? DB.escala : "";

  var act0 = document.activeElement;
  var focusKey = (act0 && act0.dataset && act0.dataset.sc) ? act0.dataset.sc : null;

  /* --- espectador: solo mira, y todo llega del servidor --- */
  if(RO){
    var strip = document.getElementById("tstrip");
    strip.hidden = true;
    strip.innerHTML = "";        // nada de los torneos propios en el DOM

    if(!roLoaded || !S){
      tabsEl.hidden = true;
      view.innerHTML = viewLoading();
      return;
    }
    tabsEl.hidden = false;
    document.body.classList.remove("home");
    if(tab === "jug") tab = "tabla";
    document.getElementById("shareApp").hidden = true;
    var abr = document.getElementById("ajustesBtn");
    abr.hidden = false;
    abr.classList.toggle("on", tab === "ajustes");
    syncCourts();
    if(S.cur > S.rounds.length - 1) S.cur = Math.max(0, S.rounds.length - 1);
    var banner = '<div class="viewer" style="margin-top:12px">' +
      '<b>'+esc(S.name)+'</b>' +
      '<p>Solo lectura. Se actualiza solo cuando el organizador anota un resultado.</p>' +
      (soyDueno >= 0
        ? '<button class="btn btn-sm" data-act="abrirComoDueno" style="margin-top:10px">Soy el organizador · anotar</button>'
        : '') +
    '</div>';
    view.innerHTML = banner + (tab === "ronda"  ? viewRonda()  :
                               tab === "cuadro" ? viewCuadro() :
                               tab === "ajustes" ? viewAjustes() : viewTabla());
    pintarBarra("torneo");
    document.getElementById("sub").textContent =
      S.players.length + " jugadores · ronda " + (S.cur + 1) + " de " + S.rounds.length;
    return;
  }

  /* --- portada y borrador: barra general para no perderse --- */
  if(enHome || !S || !S.started){
    document.body.classList.add("home");
    setLive("");                       // en vivo solo dentro de un torneo
    var sa = document.getElementById("shareApp");
    sa.hidden = false;
    sa.href = "https://wa.me/?text=" + encodeURIComponent(mensajeApp());
    document.getElementById("ajustesBtn").hidden = true;
    tabsEl.hidden = false;
    pintarBarra("home");
    if(enHome){
      view.innerHTML = tab === "ajustes" ? viewAjustes()
                     : tab === "torneos" ? viewTorneos()
                     : viewInicio();
      document.getElementById("sub").textContent =
        tab === "ajustes" ? "ajustes"
        : DB.tournaments.length
          ? DB.tournaments.length + (DB.tournaments.length===1?" torneo guardado":" torneos guardados")
          : "sorteo y marcador de pádel";
      return;
    }
    syncCourts();
    view.innerHTML = tab === "ajustes" ? viewAjustes() : viewSetup();
    var actB = actives().length;
    document.getElementById("sub").textContent =
      "creando torneo · " + actB + (actB === 1 ? " jugador" : " jugadores");
    return;
  }
  syncCourts();

  document.body.classList.remove("home");
  document.getElementById("shareApp").hidden = true;
  var ab = document.getElementById("ajustesBtn");
  ab.hidden = false;
  ab.classList.toggle("on", tab === "ajustes");

  tabsEl.hidden = false;
  if(S.cur > S.rounds.length - 1) S.cur = Math.max(0, S.rounds.length - 1);
  view.innerHTML = tab === "ronda"  ? viewRonda()  :
                   tab === "cuadro" ? viewCuadro() :
                   tab === "ajustes" ? viewAjustes() : viewTabla();
  pintarBarra("torneo");

  var act = actives().length;
  document.getElementById("sub").textContent =
    S.format + " · " + act + (act === 1 ? " jugador" : " jugadores") +
    (S.started ? " · ronda " + (S.cur + 1) : "");

  // Devolvemos el foco y el cursor a la casilla donde se estaba escribiendo.
  if(focusKey){
    var fel = view.querySelector('[data-sc="'+focusKey+'"]');
    if(fel){ fel.focus(); try{ fel.setSelectionRange(fel.value.length, fel.value.length); }catch(e){} }
  }
}

/* ============ eventos ============ */
document.addEventListener("click", function(e){
  if(!e.target || !e.target.closest) return;
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.dataset.act;

  if(RO && PROHIBIDO_MIRANDO[act]) return;      // mirando no se toca nada

  if(act === "abrirComoDueno"){
    RO = false;
    if(pollTimer) clearInterval(pollTimer);
    if(ws){ try{ ws.close(); }catch(e){} ws = null; }
    openT(soyDueno);
    save(); render();
    toast("Ahora puedes anotar");
    return;
  }
  if(act === "mYes"){ closeAsk(true); return; }
  if(act === "mNo"){ closeAsk(false); return; }

  if(act === "add"){
    var inp = document.getElementById("newName");
    if(inp && inp.value.trim()){
      addMany(inp.value); inp.value = "";
      afterSetupChange();
      var again = document.getElementById("newName"); if(again) again.focus();
    }
    return;
  }
  if(act === "rtoggle"){ toggleFromRoster(el.dataset.n); return; }
  if(act === "rdel"){ rosterDelete(el.dataset.n); return; }
  if(act === "rall"){ addAllFromRoster(); return; }
  if(act === "rnone"){ clearPicked(); return; }
  if(act === "redit"){ editRoster = !editRoster; render(); return; }
  if(act === "fmt"){ S.format = el.dataset.v; afterSetupChange(); return; }
  if(act === "scoring"){
    S.scoring = el.dataset.v;
    var lista = pointList();
    if(lista.indexOf(S.roundPoints) < 0) S.roundPoints = lista[0];
    afterSetupChange(); return;
  }
  if(act === "start"){ startTournament(); return; }
  if(act === "redraw"){ redrawAll(); return; }

  if(act === "switchT"){
    enHome = false;
    openT(+el.dataset.i); save(); render(); window.scrollTo({top:0}); return;
  }
  if(act === "homeIr"){
    enHome = true; RO = false; tab = el.dataset.v;
    render(); window.scrollTo({top:0}); return;
  }
  if(act === "verTab"){
    tab = el.dataset.v; render(); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  if(act === "volverSetup"){ tab = "ronda"; render(); window.scrollTo({top:0}); return; }
  if(act === "irAjustes"){ tab = "ajustes"; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act === "tema"){
    DB.theme = el.dataset.v || null;
    aplicarApariencia(); save(); render(); return;
  }
  if(act === "acento"){
    DB.accent = el.dataset.v;
    aplicarApariencia(); save(); render(); return;
  }
  if(act === "escala"){
    DB.escala = parseFloat(el.dataset.v) || 1;
    save(); render(); aplicarApariencia(); return;
  }
  if(act === "idioma"){
    if(el.dataset.v === "en") toast("El inglés todavía no está listo");
    return;
  }
  if(act === "inicio"){
    enHome = true; RO = false; tab = "ronda";
    render(); window.scrollTo({top:0}); return;
  }
  if(act === "irClave"){ location.href = "/t/" + el.dataset.c; return; }
  if(act === "olvidar"){
    DB.seguidos = (DB.seguidos || []).filter(function(x){ return x.clave !== el.dataset.c; });
    save(); render(); return;
  }
  if(act === "entrar"){
    var campo = document.getElementById("claveIn");
    var c = limpiaClave(campo && campo.value);
    var msg = document.getElementById("claveMsg");
    if(c.length !== 5){
      msg.textContent = "La clave son 5 caracteres.";
      msg.className = "hint mal";
      return;
    }
    msg.textContent = "Buscando el torneo…";
    msg.className = "hint";
    fetch("/api/t/" + c, { cache:"no-store" }).then(function(r){
      if(r.ok){ location.href = "/t/" + c; return; }
      msg.textContent = "No existe ningún torneo con la clave " + c + ".";
      msg.className = "hint mal";
    }).catch(function(){
      msg.textContent = "Sin conexión. Comprueba el wifi e inténtalo otra vez.";
      msg.className = "hint mal";
    });
    return;
  }
  if(act === "delT"){ deleteTournament(+el.dataset.i); return; }
  if(act === "newT"){ newTournament(); return; }

  if(act === "prev"){ S.cur = Math.max(0, S.cur - 1); save(); render(); return; }
  if(act === "nextR"){ S.cur = Math.min(S.rounds.length - 1, S.cur + 1); save(); render(); return; }
  if(act === "next"){ nextRound(); return; }
  if(act === "goto"){ S.cur = +el.dataset.r; tab = "ronda"; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act === "bump"){ bump(+el.dataset.m, el.dataset.s, +el.dataset.d); return; }

  if(act === "goTabla"){ tab = "tabla"; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act === "finalizar"){
    S.finished = true; tab = "tabla"; save(); render();
    window.scrollTo({ top:0, behavior:"smooth" });
    return;
  }
  if(act === "finish"){ S.finished = true; tab = "tabla"; save(); render(); return; }
  if(act === "reopen"){ S.finished = false; save(); render(); return; }
  if(act === "copy"){ copyTable(); return; }
  if(act === "copyDraw"){ copyDraw(); return; }
  if(act === "sheet"){ compartirHoja(); return; }
  if(act === "tablaImg"){ compartirTabla(); return; }

  if(act === "publish"){ publish(); return; }
  if(act === "unpublish"){ stopSharing(); return; }
  if(act === "ocultarClave"){ S.claveOculta = true; save(); render(); return; }
  if(act === "copyClave"){ copy(S.remote.slug, "Clave copiada: " + S.remote.slug); return; }
  if(act === "copyLink"){
    copy(el.dataset.l === "adm" ? adminLink() : publicLink(),
         el.dataset.l === "adm" ? "Tu enlace copiado" : "Enlace copiado, pásalo al grupo");
    return;
  }
  if(act === "retry"){ roLoaded = false; render(); pull(ROUTE.slug); connect(ROUTE.slug); return; }
});

document.addEventListener("input", function(e){
  if(RO) return;                                // mirando no se escribe
  var el = e.target;
  if(!el.dataset) return;

  if(el.dataset.sc !== undefined && el.classList.contains("sc")){
    setScore(+el.dataset.m, el.dataset.s, el.value);
    // Repintado completo: el otro marcador, el ganador, la cabecera, el cuadro
    // y la tabla quedan al día. El foco vuelve solo a la casilla.
    render();
    return;
  }

  if(el.dataset.act === "clave"){
    var lim = limpiaClave(el.value);
    if(el.value !== lim) el.value = lim;
    return;
  }
  if(el.dataset.act === "rename"){
    S.name = el.value.trim() || "Torneo";
    save();
    var strip = document.querySelector('.ttab[data-on="1"] .tname');
    if(strip){
      strip.innerHTML = esc(S.name) +
        (S.players.length ? ' <span style="opacity:.6">'+S.players.length+'</span>' : "");
    }
    return;
  }
});

document.addEventListener("change", function(e){
  if(RO) return;
  var el = e.target;
  if(!el.dataset) return;
  if(el.dataset.act === "minutes"){
    S.minutes = parseInt(el.value, 10) || 120;
    afterSetupChange(); return;
  }
  if(el.dataset.act === "rounds"){
    if(el.value === "auto"){ S.roundsAuto = true; }
    else { S.roundsAuto = false; S.roundsWanted = parseInt(el.value, 10); }
    afterSetupChange(); return;
  }
  if(el.dataset.act === "points"){
    S.roundPoints = parseInt(el.value, 10) || 5;
    afterSetupChange(); return;
  }
  if(el.dataset.act === "courts"){
    if(el.value === "auto"){ S.courtsAuto = true; }
    else { S.courtsAuto = false; S.courts = parseInt(el.value, 10); }
    afterSetupChange(); return;
  }
});

document.getElementById("modal").addEventListener("click", function(e){
  if(e.target === this) closeAsk(false);   // clic fuera del recuadro
});

document.addEventListener("keydown", function(e){
  if(RO && document.getElementById("modal").hidden) return;
  if(!document.getElementById("modal").hidden){
    if(e.key === "Escape"){ e.preventDefault(); closeAsk(false); }
    else if(e.key === "Enter"){ e.preventDefault(); closeAsk(true); }
    return;
  }
  if(e.key !== "Enter") return;
  if(e.target.id === "claveIn"){
    e.preventDefault();
    var b = document.querySelector('[data-act="entrar"]');
    if(b) b.click();
    return;
  }
  if(e.target.id === "newName"){
    e.preventDefault();
    if(e.target.value.trim()){
      addMany(e.target.value); e.target.value = "";
      afterSetupChange();
      var again = document.getElementById("newName"); if(again) again.focus();
    }
  }else if(e.target.classList && e.target.classList.contains("sc")){
    e.target.blur();
  }else if(e.target.id === "tname"){
    e.target.blur();
  }
});

aplicarApariencia();

/* ---------- arranque ---------- */
function arrancar(){
  if(!ROUTE){
    render();
    checkBackend().then(function(){ render(); });   // por si aparece el botón de publicar
    return;
  }

  // Damos por hecho que es espectador hasta saber lo contrario: así quien abre
  // el enlace del grupo ve "Conectando…" y nunca un destello de su propia app.
  RO = !ROUTE.key;
  roLoaded = false;
  render();
  checkBackend().then(function(hay){
    if(!hay){
      // Enlace de torneo en un alojamiento sin servidor: no hay nada que traer.
      ROUTE = null; RO = false;
      render();
      toast("Este enlace necesita el marcador en vivo");
      return;
    }

    var mine = -1;
    DB.tournaments.forEach(function(t, i){
      if(t.remote && t.remote.slug === ROUTE.slug) mine = i;
    });

    // Lo que manda es la clave del enlace, no de quién sea el teléfono.
    // Sin clave se mira y punto, aunque el torneo esté guardado aquí.
    if(ROUTE.key){
      RO = false;
      if(mine >= 0){
        openT(mine);
        S.remote.key = ROUTE.key;
        save(); render();
      }else{
        adoptRemote(ROUTE.slug, ROUTE.key);
      }
      setLive("on");
    }else{
      RO = true;
      soyDueno = mine;            // si la clave está en este teléfono, ofrecemos entrar
      render();
      pull(ROUTE.slug);
      connect(ROUTE.slug);
      pollTimer = setInterval(function(){ if(!ws) pull(ROUTE.slug); }, 8000);
      var despertar = function(){
        if(!document.hidden){ if(!ws) connect(ROUTE.slug); pull(ROUTE.slug); }
      };
      document.addEventListener("visibilitychange", despertar);
      window.addEventListener("pageshow", despertar);   // volver desde la caché de Safari
      window.addEventListener("focus", despertar);
      window.addEventListener("online", despertar);     // recupera el wifi del club
    }
  });
}
arrancar();
})();
